    note:"Different records excite different aspects: GM1 (near-fault) may produce larger peak displacement; GM2 (longer duration) may produce larger cumulative demand. Know which governs each metric." },
  { id:"P-A35",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you verify the convergence of your SAP analysis — what tolerance criteria did you use, and how many iterations did the nonlinear analysis require?",
    note:"Convergence tolerance for nonlinear analysis: typically 0.01% energy or displacement norm. More iterations needed near yield points or with complex link elements." },
  { id:"P-A36",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You used a single lumped mass per floor to represent the seismic mass. But your building has a very heavy mechanical penthouse on the roof. If that mass was incorrectly modelled as distributed rather than concentrated at the penthouse level, how would that error affect the fundamental period and roof acceleration predictions?",
    note:"TRICK: concentrated roof mass increases the effective mass participation in the first mode and lengthens T₁; it also increases roof acceleration amplification. Distributing it over multiple floors underestimates both effects." },
  { id:"P-A37",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the ASCE 7-22 Seismic Design Category (SDC) for your building, and how does that SDC determine which analysis procedure you are permitted or required to use?",
    note:"SDC A/B: simplified analysis allowed; SDC C/D/E/F: ELF or modal analysis required; SDC D/E/F with certain irregularities: modal or time history required." },
  { id:"P-A38",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"How sensitive are your performance predictions to a ±10% change in the assumed elastic modulus of balsa — and did you perform a sensitivity study?",
    note:"E affects both stiffness and frequency; ±10% E change shifts T by ±5% (T ∝ 1/√E) and changes displacements proportionally. Sensitivity study validates robustness of predictions." },
  { id:"P-A39",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the effect of soil-structure interaction on the free-field ground motion versus the motion at the base of your building — and in which direction does SSI typically shift the fundamental period?",
    note:"SSI typically lengthens the apparent period of the structure-foundation system (adds flexibility); it also adds radiation damping as energy radiates into the soil." },
  { id:"P-A40",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you report and present your predictions — as a single deterministic value, a mean and standard deviation, or a confidence interval — and which format is most informative for the competition judges?",
    note:"Mean ± σ (or coefficient of variation) is more informative than a single value; it shows both the expected outcome and the uncertainty in that prediction." },
  { id:"P-A41",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your analysis predicted a peak roof displacement of 12mm and the shake table test produced 19mm — a 58% underestimate. Rather than simply saying 'construction imperfections caused the discrepancy', can you identify at least three specific modelling assumptions that could systematically underestimate displacement?",
    note:"TRICK: three systematic underestimation sources: (1) perfect rigid joint assumption vs. semi-rigid reality; (2) no P-delta effects; (3) wrong elastic modulus (used manufacturer value, not measured). Each can contribute 10–30% individually." },
  { id:"P-A42",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you use the floor acceleration demand to check the anchorage design of heavy non-structural components — furniture, mechanical equipment, and facade elements?",
    note:"Non-structural component force = Fp = 0.4 × SDS × Ip × Wp × (1 + 2z/h) per ASCE 7-22 Section 13. Floor acceleration from THA can replace the code equation for a more precise check." },

  // ── ARCHITECTURAL & SUSTAINABILITY B2 (21) ────────────────
  { id:"P-AR22",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you calculate your building's embodied carbon footprint — what material quantities and carbon factors did you use, and how does it compare to a conventional concrete frame building?",
    note:"Embodied carbon = material mass × carbon intensity factor (kgCO₂e/kg); structural steel: ~2.0 kgCO₂e/kg; concrete: ~0.1–0.2 kgCO₂e/kg (but more by volume)." },
  { id:"P-AR23",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the Window-to-Wall Ratio (WWR) for each facade orientation of your building, and how did it influence both the thermal performance and the structural glazing system?",
    note:"High WWR (>60%) improves daylighting but increases heat loss and solar gain; it also requires more complex structural glazing with seismic drift accommodation." },
  { id:"P-AR24",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your building has a 'green' designation partly because it uses recycled steel in the structure. But recycled steel has a lower guaranteed yield strength than virgin steel due to tramp element contamination. Did you account for the potentially lower strength of recycled steel in your structural calculations?",
    note:"TRICK: recycled steel can have lower ductility and strength due to tramp elements (copper, tin). Using standard A36 or A992 properties for recycled steel is non-conservative if the actual grade is lower." },
  { id:"P-AR25",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does the placement of mechanical equipment — HVAC units, cooling towers — on the roof affect the structural response under seismic loading?",
    note:"Roof-mounted mechanical equipment adds mass at the highest elevation, amplifying overturning moment and increasing roof acceleration demand on equipment anchorage." },
  { id:"P-AR26",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is your building's thermal mass strategy — does the structural system contribute to thermal mass, and how does that affect heating and cooling energy use?",
    note:"Exposed concrete slabs or masonry provide thermal mass that moderates daily temperature swings; in Seattle's mild climate this can reduce peak HVAC loads by 15–25%." },
  { id:"P-AR27",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you coordinate your seismic joint (expansion/isolation joint) with the architectural program — does the joint run through occupied spaces, and how is it detailed at floor, wall, and ceiling levels?",
    note:"Seismic joints must run completely through the building; they require flexible covers at floors and walls. Poor coordination can create unsafe conditions and unsightly architectural features." },
  { id:"P-AR28",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your building's signature 'sky bridge' connecting Zone 1 and Zone 2 is architecturally striking — but dynamically, it creates a link between two structures with different natural periods. Could the sky bridge act as a transfer of seismic force between the zones, potentially overloading the connections at peak response?",
    note:"TRICK: bridges between buildings with different periods create pounding or force-transfer problems at peak relative displacement. The bridge connections must be designed as seismic fuses or flexible links, not rigid connections." },
  { id:"P-AR29",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you choose the ceiling height for each zone — and what is the structural depth of the floor system that must fit within that zone?",
    note:"Total floor-to-floor height = ceiling height + structural depth (beam + slab) + MEP clearance. Structural depth drives this; deeper beams need more floor height." },
  { id:"P-AR30",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is your strategy for managing construction waste on this urban infill site — how does your material specification reduce waste, and what percentage of waste do you expect to divert from landfill?",
    note:"Prefabrication and modular construction reduce on-site waste; modern construction aims for 75–90% waste diversion through recycling and reuse." },
  { id:"P-AR31",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does your building respond to the urban heat island effect — did you consider cool roof materials, green roofs, or shading strategies to reduce surface temperature?",
    note:"Cool roofs (high reflectance) reduce roof temperatures by 30–50°C vs. dark roofs; green roofs provide evaporative cooling. Both reduce cooling loads and urban heat island effect." },
  { id:"P-AR32",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your architectural narrative emphasises occupant wellbeing through biophilic design — natural materials, plants, views of nature. But after a major earthquake, the building may have significant non-structural damage. How does the post-earthquake condition of your biophilic features (planters, interior trees, water features) affect re-occupancy decisions?",
    note:"TRICK: heavy planters, water features, and interior trees can become falling hazards in an earthquake; they must be anchored per ASCE 7-22 non-structural component requirements. Their post-earthquake condition affects building re-occupancy." },
  { id:"P-AR33",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the proposed structural system for the elevated passageway — is it hung from above, supported from below, or cantilevered — and how does each option affect the host structure?",
    note:"Hung passageways transfer tension forces to the floors above; cantilevered passageways add significant moment to the supporting columns; ground-supported avoids structural complications." },
  { id:"P-AR34",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does your building integrate stormwater management beyond rainwater harvesting — did you incorporate permeable paving, retention ponds, or bioswales in your site plan?",
    note:"Seattle requires on-site stormwater management for new development; permeable paving and bioswales reduce peak runoff and improve water quality." },
  { id:"P-AR35",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you address the thermal bridging problem at the perimeter structural frame — do steel columns and beams that penetrate the insulation envelope create significant heat loss paths?",
    note:"Thermal bridges at structural elements can increase envelope heat loss by 20–40%; solutions include exterior insulation, thermal break elements at facade connections." },
  { id:"P-AR36",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You designed a beautiful observation deck at the top of Zone 3 — but the observation deck adds 100 occupants worth of live load at the highest point of the building. How does that intermittent live load at the roof affect your seismic mass calculation, and should you include it in the seismic weight?",
    note:"TRICK: ASCE 7-22 includes a portion of live load (25% for storage, 100% of roof live where > 100psf) in seismic weight. Observation deck occupancy load should be checked — if it represents a significant permanent live load, it increases seismic weight and overturning moment." },
  { id:"P-AR37",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you design for adaptability of the building over its 50-year life — are the floor plates flexible enough to accommodate different future occupancy types?",
    note:"Adaptable buildings use wide structural bays (9–12m) without intermediate columns, enabling future reconfiguration between residential, office, and retail occupancy." },
  { id:"P-AR38",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"What fire egress strategy did you use for the elevated passageway — how do occupants evacuate from the bridge to a place of safety during a fire or earthquake?",
    note:"Elevated passageways need their own egress strategy: stair access at both ends, fire suppression, and clear connection to exit routes." },
  { id:"P-AR39",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you balance the visual transparency of the facade (glazing) with the structural need to brace the perimeter frame — did glazing panels provide any in-plane shear resistance?",
    note:"Structural glazing systems can provide in-plane shear if properly designed and detailed; conventional glazing provides zero structural contribution." },
  { id:"P-AR40",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the occupant load of your building per zone, and how does that occupant count drive your egress system requirements for stairwells, elevators, and exit widths?",
    note:"Occupant load = floor area / load factor (per IBC Table 1004.5); stair width = occupant load × 0.3 inch/person; determines number and width of required exit stairs." },
  { id:"P-AR41",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your building's mechanical floor has no occupants and you therefore designed it with a lower live load. But mechanical equipment rooms also house heavy pumps, tanks, and air handling units. Did you use the correct IBC live load for mechanical rooms, and how does that load compare to the office live load you used for occupied floors?",
    note:"TRICK: IBC requires 125 psf for mechanical rooms, compared to 50 psf for offices. Using office live load in a mechanical room significantly under-designs the floor structure." },

  // ── FINANCIAL ANALYSIS B2 (20) ────────────────────────────
  { id:"P-F21",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the cap rate for your building type in downtown Seattle, and how did you use it to estimate the building's market value upon completion?",
    note:"Market value = Net Operating Income / Cap Rate. Seattle Class A office cap rates: 4–6%. This is how investors value income-producing real estate." },
  { id:"P-F22",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you calculate the Internal Rate of Return (IRR) for your investment — and what IRR threshold would make this project attractive to a typical institutional investor?",
    note:"IRR is the discount rate at which NPV = 0; institutional investors typically target 8–12% IRR for stabilised urban real estate. IRR < 7% is usually unacceptable." },
  { id:"P-F23",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You calculated your building's value using a cap rate applied to Year 1 NOI. But your occupancy will ramp up gradually from 60% in Year 1 to 95% in Year 3. If you valued the building on stabilised Year 3 NOI instead of Year 1 NOI, by how much would the valuation change — and which is the more appropriate value for a construction loan lender?",
    note:"TRICK: lenders typically lend against stabilised value (Year 3+), not Year 1 value; using Year 1 NOI underestimates eventual value but overestimates available loan proceeds during ramp-up." },
  { id:"P-F24",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is a Loan-to-Cost (LTC) ratio and a Loan-to-Value (LTV) ratio — and what typical ratios would a construction lender and a permanent lender apply to your project?",
    note:"LTC = loan amount / total project cost; LTV = loan amount / appraised value. Construction loans: LTC 65–75%; permanent loans: LTV 65–70%." },
  { id:"P-F25",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you account for inflation in your 30-year financial model — did you use nominal cash flows or real cash flows, and what inflation rate did you assume?",
    note:"Nominal cash flows include inflation effects; real (inflation-adjusted) cash flows use constant dollars. Both are valid if the discount rate is consistently nominal or real. Current US inflation: ~3%." },
  { id:"P-F26",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the difference between hard costs and soft costs in your construction budget — and what percentage of total project cost did soft costs represent?",
    note:"Hard costs: materials and labour; soft costs: design fees, permits, financing costs, legal, insurance, marketing. Soft costs typically 20–30% of hard costs." },
  { id:"P-F27",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your financial model shows a 20-year payback period. But a structural engineer typically designs a building for a 50-year service life. What happens to the financial model in years 20–50 — and how does the residual value of the land and structure at year 50 affect the overall investment return?",
    note:"TRICK: residual (terminal) value at year 50 can represent 30–50% of total project return in a DCF model. Ignoring it significantly underestimates total IRR." },
  { id:"P-F28",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"What federal or Seattle-specific tax incentives for sustainable buildings did you factor into your financial model — and how significantly do they improve the IRR?",
    note:"IRS 179D deduction for energy-efficient commercial buildings: up to $5/sqft. Historic tax credits (if applicable). Seattle energy benchmarking compliance can also affect lender requirements." },
  { id:"P-F29",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does the cost of seismic design and construction — beyond a basic code-compliant building — appear as a line item in your budget, and what percentage premium does seismic design add to your total construction cost?",
    note:"Seattle seismic design premium over basic non-seismic design: typically 2–8% of total hard costs, depending on the system chosen (moment frames cost more than braced frames)." },
  { id:"P-F30",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"What percentage of your total project budget is allocated to seismic resilience features beyond code minimum — dampers, base isolation, enhanced detailing — and how did you justify that expenditure to a hypothetical client?",
    note:"Enhanced seismic resilience premium: 1–5% of hard costs. Justification: reduced post-earthquake repair costs, faster re-occupancy, lower business interruption losses, insurance premium reductions." },
  { id:"P-F31",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You assumed a constant 3% annual rent growth in your financial model. But Seattle's rental market is highly cyclical, with rent declines of 15–20% during economic downturns. How does replacing constant growth with a cyclical rent model change your 30-year NPV, and does the project still pass the investment threshold?",
    note:"TRICK: constant growth assumptions overestimate stability. A cyclical model with two downturns in 30 years can reduce total NPV by 15–25% and extend the payback period significantly." },
  { id:"P-F32",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you handle the financial impact of the building's required ADA improvements — are they included in your construction cost, and what is the approximate cost premium for full ADA compliance?",
    note:"ADA compliance adds 1–3% to construction costs for new buildings; retroactive compliance in renovations is much more expensive. New buildings built to code include this cost in base construction." },
  { id:"P-F33",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is your building's Gross Development Value (GDV) and how does it compare to your Total Development Cost (TDC) — and what is the resulting development margin?",
    note:"Development margin = (GDV - TDC) / GDV. A healthy margin for urban development is 15–25%; below 10% is typically not fundable." },
  { id:"P-F34",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"Did you include earthquake insurance as an operating expense in your financial model — and given the seismic risk in Seattle, what annual premium might a building owner expect to pay?",
    note:"Earthquake insurance premiums in Seattle: typically 0.1–0.5% of insured value annually. For a $100M building, this is $100K–$500K/year — a significant operating cost." },
  { id:"P-F35",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you account for potential construction cost escalation over a 3-year build period — construction material and labour costs can change significantly during a long project?",
    note:"Construction cost escalation: 3–8% per year in recent years. For a 3-year project with escalation front-loaded, a 5% per year escalation adds roughly 7–10% to the final construction cost." },
  { id:"P-F36",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your financial model treats the building as being sold at the end of year 5 at a cap rate of 5%. But if interest rates rise 200 basis points between now and year 5, cap rates typically also rise, compressing your exit value. By how much would a 200bp cap rate increase reduce your exit proceeds?",
    note:"TRICK: exit value = NOI / cap rate; if cap rate rises from 5% to 7%, the exit value drops by 29%. This is the single largest source of financial risk in the model and is frequently ignored by student teams." },
  { id:"P-F37",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the difference between a gross lease and a net lease structure — and which lease type did you assume in your rental income model for the commercial floors?",
    note:"Gross lease: tenant pays fixed rent, owner covers operating expenses; net lease (NNN): tenant pays rent PLUS taxes, insurance, maintenance. Net lease provides more predictable net income for owner." },
  { id:"P-F38",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does the mixed-use nature of your building affect the financing structure — would a lender treat the residential and commercial components as separate assets or fund the whole project on a single loan?",
    note:"Mixed-use buildings can have separate condominiums or blended financing; lenders often require a minimum percentage of residential pre-sales before funding." },
  { id:"P-F39",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the total square footage of your building per the three zones, and how does the allocation between residential, office, and retail affect the blended average rental rate?",
    note:"Blended rent = Σ(area_i × rate_i) / total area. The zone allocation between high-rent office and lower-rent retail significantly affects the blended average and total income." },
  { id:"P-F40",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You assumed your building construction would take exactly 36 months. But permitting delays, material shortages, and weather can extend that timeline. What is the financial impact of a 6-month construction delay — how much additional interest accrues and how much rental income is lost?",
    note:"TRICK: 6-month delay = 6 months of additional construction loan interest + 6 months of delayed rental income. For a $100M loan at 7%, that's $3.5M in extra interest alone, before accounting for lost income." },

  // ── TEAM ORGANIZATION B2 (20) ─────────────────────────────
  { id:"P-T21",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did your team divide the work between the geotechnical, structural, architectural, financial, and sustainability sub-teams — and how frequently did the sub-teams meet together to coordinate?",
    note:"Cross-functional integration meetings are as important as sub-team work sessions; lack of integration leads to conflicting assumptions and design errors." },
  { id:"P-T22",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"What quality assurance process did you apply to your structural model — did any team member independently verify the critical calculations or model inputs?",
    note:"Independent verification (second pair of eyes on critical calculations) is standard engineering practice; it catches input errors before they propagate to final results." },
  { id:"P-T23",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You mentioned that the team member who built the SAP model is the same person who validated the results — is that an effective quality assurance approach, and what kind of errors could that miss?",
    note:"TRICK: self-review misses systematic errors in thinking. Independent check by a team member unfamiliar with the model is far more effective at catching conceptual mistakes." },
  { id:"P-T24",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you prepare for the Q&A session specifically — did you run mock Q&A sessions, and how did you decide who would answer which types of questions?",
    note:"Mock Q&A sessions with a faculty advisor playing the role of judge are the most effective preparation. Pre-assigning question types (structural, geotechnical, etc.) ensures clear ownership." },
  { id:"P-T25",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"What was the most significant technical risk in your project — the thing that worried you most — and how did you manage or mitigate that risk?",
    note:"Identifying and managing the highest-risk element shows engineering maturity; typical risks include physical model failure, model calibration uncertainty, and prediction accuracy." },
  { id:"P-T26",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"How long did the physical model construction take from start to finish, and at what point did you realise that construction was the critical path for your project schedule?",
    note:"Physical construction typically takes 2–4 weeks; teams often underestimate it. Realising construction is critical late causes rushed, lower-quality results." },
  { id:"P-T27",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your team has 8 members. Research on team dynamics suggests optimal team size for complex problem-solving is 4–6 people. Did you observe any of the coordination costs or social loafing effects associated with larger teams, and how did you address them?",
    note:"TRICK: larger teams have higher coordination overhead and tend to experience social loafing (free-riding). Best teams actively manage this through clear role accountability and individual deliverable ownership." },
  { id:"P-T28",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you handle the interface between your physical model and the competition shake table — what base connection system did you design, and how did you verify it would not fail during testing?",
    note:"Base connection to shake table platen is critical; loose or under-designed connections have caused physical model failures before the structural system was even tested." },
  { id:"P-T29",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"What lessons from this competition would you take forward to a professional engineering career — what skills did you develop that textbook courses did not provide?",
    note:"Open-ended reflection question; judges appreciate specific skills: multi-disciplinary coordination, design under uncertainty, iterative problem solving, time pressure decision-making." },
  { id:"P-T30",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you manage the balance between achieving the best possible structural performance and staying within the competition weight limit — where did you make the most difficult trade-off decisions?",
    note:"The performance-weight trade-off is the central design optimisation problem; teams should be able to describe specific decisions where adding structure was declined due to weight impact." },
  { id:"P-T31",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You said your team is 'very satisfied' with the design. But satisfaction with a design during preparation often leads to confirmation bias when reviewing the results — interpreting ambiguous data in favour of the design. Can you give a specific example where you deliberately challenged your own assumptions?",
    note:"TRICK: confirmation bias is a well-documented problem in engineering design. A mature team actively seeks disconfirming evidence (failure modes, pessimistic scenarios) to test the design." },
  { id:"P-T32",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"How many iterations of the physical model did your team build — if more than one, what specifically failed in the first version and how was the second version improved?",
    note:"Multiple prototypes are a sign of rigorous physical testing; each iteration should have a specific documented improvement based on observed failure mode." },
  { id:"P-T33",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did your team deal with incomplete or ambiguous information in the competition brief — what assumptions did you make, and how did you document and communicate them?",
    note:"Engineering always involves incomplete information; documenting assumptions is critical for traceability. Teams should be able to list their key assumptions and justify them." },
  { id:"P-T34",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"Did your team consider hiring an external consultant (faculty expert in a specific area) for any part of the project — and if not, was there a technical area where external expertise would have helped most?",
    note:"Identifying knowledge gaps and seeking expert input is professional practice; many teams lack expertise in geotechnics or financial modeling and could benefit from consultation." },
  { id:"P-T35",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You optimised your design to perform best under the specific 11 ground motions provided. But real earthquakes are different from those records. How confident are you that a real Seattle earthquake would not reveal a weakness in your design that the 11 records happened to not excite?",
    note:"TRICK: this is the fundamental limitation of record-specific optimisation. A robust design performs well across a wide variety of records, not just the provided 11. Teams should discuss how they checked robustness beyond the mandatory suite." },
  { id:"P-T36",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you plan and rehearse the 20-minute presentation — how many full run-throughs did you do, and how did you time each section to fit within the limit?",
    note:"Consistent timing across all rehearsals ensures the presentation fits; typical SDC allocations: architecture 4min, structural 6min, analysis/predictions 4min, financial 3min, conclusion 2min." },
  { id:"P-T37",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you ensure that international team members with different educational backgrounds were using consistent definitions, sign conventions, and unit systems throughout the project?",
    note:"Unit confusion (metric vs. imperial) and sign convention inconsistencies are common sources of error in international teams; a shared glossary and unit standard should be established early." },
  { id:"P-T38",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"What was the team's strategy for the week before competition — what did you prioritise in the final days, and what did you consciously leave unfinished?",
    note:"Final week priorities: model condition, Q&A preparation, presentation polish, logistics. Teams that try to finish everything in the last week often arrive at competition exhausted and under-prepared for Q&A." },
  { id:"P-T39",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you approach the situation where your analysis predictions changed significantly after a late model revision — did you have time to update all the presentation slides, and were there any inconsistencies left in the final presentation?",
    note:"Late model changes are common; a good process includes a checklist of all slides and documents that need updating when predictions change." },
  { id:"P-T40",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Every team in this competition is trying to win. What specific, quantifiable advantage does your design have over a hypothetical 'average' competing team — and how would you know if you succeeded before the scores are announced?",
    note:"TRICK: this tests strategic self-assessment. A good answer identifies specific measurable advantages (lowest weight-to-performance ratio, best prediction accuracy, clearest financial model) rather than generic claims of quality." },

  // ── ADA & ACCESSIBILITY B2 (20) ───────────────────────────
  { id:"P-ADA21",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the maximum running slope and cross slope of an accessible exterior route, and how did your site plan ensure compliance from the public sidewalk to the building entrance?",
    note:"ADA: max running slope 1:20 (5%) for accessible routes (not ramps); max cross slope 1:48 (2%). Steeper sidewalks require a separate accessible route with a compliant ramp." },
  { id:"P-ADA22",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:false,repeatGroup:null,repeatCount:0,
    question:"How many accessible hotel or residential guest rooms does your building include, and what percentage of total rooms must be accessible under the ADA and IBC?",
    note:"ADA Hotels: 1 accessible room per 25 total rooms (min); Fair Housing Act requires ground-floor accessible units in multifamily. Percentages vary by building type." },
  { id:"P-ADA23",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your building's main accessible route goes past a fountain feature that produces mist and splashes onto the adjacent walkway. In wet weather, the walkway surface becomes slippery below the required coefficient of friction. Does your accessible route comply with ADA, and how would you address the wet surface condition?",
    note:"TRICK: accessible routes must maintain coefficient of friction ≥ 0.6 for level surfaces and ≥ 0.8 for ramps. Wet fountain splashing creates a non-compliant temporary condition — solution: reroute the accessible path away from the water feature or use slip-resistant textured pavers." },
  { id:"P-ADA24",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is an Area of Refuge, how large must it be, and how must it be connected to the exit stairwell under IBC 2021?",
    note:"Area of Refuge: min 30×48 inch wheelchair space adjacent to exit stairwell, with two-way communication system. Required on every floor above/below grade for non-sprinklered or certain tall buildings." },
  { id:"P-ADA25",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you accommodate accessible viewing in your assembly spaces — what percentage of seats must be wheelchair spaces, and where are they required to be located relative to the stage or screen?",
    note:"ADA: 1 wheelchair space per 100 fixed seats (min); dispersed throughout seating including front, middle, and rear sections; companion seat adjacent to each." },
  { id:"P-ADA26",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:false,repeatGroup:null,repeatCount:0,
    question:"What detectable warning surface is required at hazardous vehicular-pedestrian crossings near your building entrance, and what does it look like?",
    note:"Detectable warnings: truncated dome surface, 24-inch depth (min) across full width of curb cut; colour contrast with surrounding surface required. Required at all curb ramps and hazardous crossings." },
  { id:"P-ADA27",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your building's main lobby has a revolving door as the primary entrance — it's architecturally distinctive and energy-efficient. But revolving doors are not accessible. What does ADA require when a revolving door is the primary entrance?",
    note:"TRICK: ADA requires an accessible door (swinging or automatic sliding) adjacent to any revolving door used as the primary entrance. The accessible door must be on an accessible route and within close proximity." },
  { id:"P-ADA28",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you address accessible signage for a building with multiple occupancy types — office, residential, and retail — each with different signage requirements?",
    note:"ADA signage requirements: permanent room identification signs must have Braille and raised characters; directional and informational signs must meet character size and finish requirements." },
  { id:"P-ADA29",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the difference between ADA requirements and universal design principles — and did your design go beyond ADA minimum requirements in any specific area?",
    note:"ADA is a legal minimum standard; universal design aims for usability by the widest possible range of people regardless of ability. Examples beyond ADA: wider corridors (48 vs 44 min), multiple wheelchair spaces per room." },
  { id:"P-ADA30",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you ensure that the building's emergency notification system complies with ADA requirements for both hearing-impaired and vision-impaired occupants?",
    note:"ADA requires visual alarms (strobes) in all public and common areas; visual alarms must achieve minimum candela output based on room volume. Auditory alarms alone are insufficient." },
  { id:"P-ADA31",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ During a seismic event, the elevator doors may fail to open due to building tilt or power failure. Your building has 20 stories. How does your design ensure that mobility-impaired occupants above the first floor can evacuate without elevator access during an extended power outage after an earthquake?",
    note:"TRICK: post-earthquake elevator failure is a real scenario. IBC requires Areas of Refuge with two-way communication; fire department EVAC chairs in stairwells are a secondary measure. The answer should address both the code requirement and the practical evacuation procedure." },
  { id:"P-ADA32",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:false,repeatGroup:null,repeatCount:0,

  { id:"P-ADA33",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:false,repeatGroup:null,repeatCount:0,

  { id:"P-ADA34",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the maximum allowable vertical change in level on an accessible floor surface without providing a bevel or ramp — and how did your floor finish transitions comply?",

  { id:"P-ADA35",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:true,repeatGroup:null,repeatCount:0,

  // ── MATERIAL PROPERTIES & TESTING B2 (21) ─────────────────
  { id:"P-M22",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the difference between stiffness, strength, and ductility — and how do these three properties rank in priority for the members of your seismic lateral load-resisting system?",
    note:"Stiffness: resistance to deformation; strength: maximum force capacity; ductility: ability to deform beyond yield without fracture. For seismic: ductility > strength > stiffness in most cases." },
  { id:"P-M23",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you account for the effect of glue joint creep over the multi-week project duration — could the model have been measurably softer at competition day compared to when you first assembled it?",
    note:"PVA glue and CA glue can creep under sustained load; the joint stiffness at competition may be lower than at assembly. Physical frequency testing close to competition day is the best check." },
  { id:"P-M24",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You used cyanoacrylate (super glue) for your joints because it sets quickly and is strong. But cyanoacrylate is brittle and has very low peel strength. Under seismic loading, joint rotations create peel-mode stresses, not just shear. Did you test the joint peel capacity, and could joint peel failure be your model's governing failure mode?",
    note:"TRICK: CA glue is strong in shear but weak in peel; joint rotations during seismic loading create peel stresses. Testing joints in shear alone under-estimates the risk of peel-mode fracture under real cyclic loading." },
  { id:"P-M25",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you determine the cross-section of your gusset plates — what load did you design them to carry and what failure mode governed their design?",
    note:"Gusset plates transfer brace forces to beam-column joints; failure modes include net section fracture, block shear, and Whitmore section buckling." },
  { id:"P-M26",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,
    question:"What was the measured frequency from your white noise test before and after any model repairs or modifications — and did those modifications shift the frequency in the expected direction?",
    note:"Adding stiffness should increase frequency; adding mass should decrease it. If the frequency change went the wrong way, something unexpected happened to the model." },
  { id:"P-M27",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you apply mass blocks to simulate the floor weights in your physical model — what material did you use, how were they attached, and how did you verify the attachment would not fail during shaking?",
    note:"Mass blocks (typically lead, steel, or brass) must be attached with adequate fasteners to survive competition-level acceleration; loose mass blocks are dangerous projectiles." },
  { id:"P-M28",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your physical model is made at roughly 1:50 scale. If you scale down the balsa member dimensions by 1:50 but the shaking table applies a full-scale accelerogram (not a scaled time or frequency-modified version), are you actually testing a correctly scaled model, or have you created a scale inconsistency?",
    note:"TRICK: proper shake table scaling requires simultaneous scaling of length, mass, and time. If only geometric scaling is applied and the time axis of the ground motion is not compressed by √(scale factor), the model experiences higher normalized frequencies than the prototype." },
  { id:"P-M29",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you determine the mode shapes of your physical model — did you use accelerometers at multiple floors during the white noise test, or just a single measurement point?",
    note:"Mode shape identification requires accelerometers (or strain gauges) at multiple heights; a single measurement point identifies frequency but not mode shape." },
  { id:"P-M30",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the relationship between the section modulus S, the moment of inertia I, and the bending stress in your structural members — and how did you use this relationship to check member adequacy?",
    note:"σ = M/S = M×c/I; section modulus S = I/c for the extreme fiber. Maximum bending stress from SAP moment demand must be below the modulus of rupture for each member." },
  { id:"P-M31",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You performed three-point bending tests on 5 specimens and found an average E of 4.2 GPa. But when you calibrated your SAP model against the measured frequency, you needed to use E = 2.8 GPa to match. What physical reasons could explain why the effective structural E is 33% lower than the material test E?",
    note:"TRICK: the discrepancy between material E and structural E comes from joint flexibility (semi-rigid connections), local defects (knots, grain angle), and boundary condition differences between the coupon test and the structure." },
  { id:"P-M32",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,

  { id:"P-M33",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you test whether your damper device produces the expected force-displacement hysteresis — what test setup did you use and how did you measure force and displacement simultaneously?",

  { id:"P-M34",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the difference between a static and a dynamic elastic modulus — and for predicting seismic response, which is more appropriate to use?",
    note:"Dynamic E (from wave velocity) is typically 5–15% higher than static E from three-point bending; for seismic response prediction (dynamic problem), dynamic E is more appropriate." },
  { id:"P-M35",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your three-point bending test measured E from the initial linear portion of the load-deflection curve. But if even one of your 5 test specimens had a knot or grain defect that caused early non-linearity, the 'average' E you computed would be biased low. How did you screen your test specimens for defects before testing?",
    note:"TRICK: specimen defects (knots, grain deviation) artificially lower measured E. Professional material testing screens specimens visually and by density before testing; results from defective specimens should be flagged and potentially excluded." },
  { id:"P-M36",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you account for the effect of load rate on balsa wood strength — balsa is a viscoelastic material, and its apparent stiffness and strength depend on how fast it is loaded?",
    note:"Viscoelastic materials are stiffer and stronger under rapid loading (seismic) than under slow loading (static testing). Static test E underestimates dynamic E by 5–15% for wood." },
  { id:"P-M37",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,

  { id:"P-M38",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,

  { id:"P-M39",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you use the free-vibration logarithmic decrement method to separate out the structural damping contribution from the damper contribution?",
    note:"Test structure without damper → measure ξ_structural from log decrement. Test with damper → measure ξ_total. Difference = ξ_supplemental from damper (approximate)." },
  { id:"P-M40",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,

    note:"Improvements: dynamic testing machine for cyclic loading; digital image correlation (DIC) for full-field strain measurement; more specimens per test; testing at competition-day humidity conditions." },
  { id:"P-M41",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You calibrated your SAP model by adjusting the elastic modulus until the computed frequency matched the measured frequency. But if the mass distribution in your SAP model was incorrect (say, 10% lower than actual), you would have also changed E to compensate. In that case, your 'calibrated' E is wrong and will produce incorrect stress predictions even though the frequency matches. How would you diagnose whether a frequency mismatch comes from wrong E versus wrong mass?",
    note:"TRICK: frequency = √(k/m); a mismatch can come from wrong stiffness (E) or wrong mass. To distinguish: weigh the physical model precisely, update mass in SAP, and only then adjust E. If mass was wrong and you only adjusted E, you have compensating errors." }


];

// ── Category metadata ──────────────────────────────────────────
const CATEGORIES = {
  "cat-structural": { label: "Structural System", color: "#1a3a5c" },
  "cat-damping":    { label: "Damping System",    color: "#5c1a3a" },
  "cat-geotech":    { label: "Geotechnical & Site Class", color: "#1a5c3a" },
  "cat-ground":     { label: "Ground Motion Selection",   color: "#5c3a1a" },
  "cat-analysis":   { label: "Analysis & Performance",    color: "#3a1a5c" },
  "cat-arch":       { label: "Architectural & Sustainability", color: "#1a5c5c" },
  "cat-financial":  { label: "Financial Analysis",  color: "#5c5c1a" },
  "cat-team":       { label: "Team Organization & Process", color: "#5c4a1a" },
  "cat-ada":        { label: "ADA & Accessibility", color: "#3a5c1a" },
  "cat-material":   { label: "Material Properties & Testing", color: "#4a1a5c" }
};

// ── Build Legend ───────────────────────────────────────────────
function buildLegend() {
  const legend = document.getElementById("legend");
  Object.entries(CATEGORIES).forEach(([key, meta]) => {
    const count = QUESTIONS.filter(q => q.category === key).length;
    const item = document.createElement("div");
    item.className = "legend-item";
    item.innerHTML = `<div class="legend-dot" style="background:${meta.color}"></div>${meta.label} <span style="color:#aaa">(${count})</span>`;
    item.onclick = () => {
      document.getElementById("filter-cat").value = key;
      applyFilters();
    };
    legend.appendChild(item);
  });
}

// ── Render ─────────────────────────────────────────────────────
function renderQuestions(filtered) {
  const list = document.getElementById("question-list");
  list.innerHTML = "";
  filtered.forEach(q => {
    const isHot = q.repeatCount >= 3;
    const isRepeat = q.repeatGroup !== null;
    const card = document.createElement("div");
    card.className = `q-card ${q.category}`;
    const isPractice = q.year === "PRACTICE";
    const isTrick = q.trick === true;
    card.innerHTML = `
      <div class="q-header">
        <span class="q-id">#${q.id}</span>
        <span class="q-text">${q.question}</span>
      </div>
      <div class="q-meta">
        <span class="badge badge-year" style="${isPractice ? 'background:#1a5c1a' : ''}">${q.year}</span>
        <span class="badge badge-source">${q.team}</span>
        <span class="badge badge-cat ${q.category}">${q.categoryLabel}</span>
        ${isPractice ? `<span class="badge badge-practice">✦ PRACTICE</span>` : ''}
        ${isTrick ? `<span class="badge badge-trick">⚡ TRICK</span>` : ''}
        ${isHot && !isPractice ? `<span class="badge badge-hot">🔥 HOT — ${q.repeatCount}x across teams</span>` : ''}
        ${isRepeat && !isHot && !isPractice ? `<span class="badge badge-repeat">⟳ REPEATED — ${q.repeatCount}x</span>` : ''}
      </div>
      ${q.note ? `<div class="pattern-note">↳ ${q.note}</div>` : ''}
    `;
    list.appendChild(card);
  });
}

// ── Filter logic ───────────────────────────────────────────────
function applyFilters() {
  const search = document.getElementById("search").value.toLowerCase();
  const catFilter = document.getElementById("filter-cat").value;
  const yearFilter = document.getElementById("filter-year").value;
  const repeatOnly = document.getElementById("filter-repeat").checked;
  const hotOnly = document.getElementById("filter-hot").checked;
  const practiceOnly = document.getElementById("filter-practice").checked;
  const trickOnly = document.getElementById("filter-trick").checked;

  const filtered = QUESTIONS.filter(q => {
    if (search && !q.question.toLowerCase().includes(search) && !q.team.toLowerCase().includes(search) && !(q.note && q.note.toLowerCase().includes(search))) return false;
    if (catFilter && q.category !== catFilter) return false;
    if (yearFilter && String(q.year) !== yearFilter) return false;
    if (repeatOnly && !q.repeatGroup) return false;
    if (hotOnly && q.repeatCount < 3) return false;
    if (practiceOnly && q.year !== "PRACTICE") return false;
    if (trickOnly && !q.trick) return false;
    return true;
  });

  renderQuestions(filtered);
  updateStats(filtered);
}

// ── Stats ──────────────────────────────────────────────────────
function updateStats(filtered) {
  const total = QUESTIONS.length;
  const repeated = QUESTIONS.filter(q => q.repeatGroup).length;
  const hot = QUESTIONS.filter(q => q.repeatCount >= 3).length;
  const teams = [...new Set(QUESTIONS.map(q => q.team))].length;

  document.getElementById("stat-total").textContent = total;
  document.getElementById("stat-visible").textContent = filtered.length;
  document.getElementById("stat-repeat").textContent = repeated;
  document.getElementById("stat-hot").textContent = hot;
  document.getElementById("stat-teams").textContent = teams;
  document.getElementById("results-info").textContent = `Showing ${filtered.length} of ${total} questions`;
}

// ── Init ───────────────────────────────────────────────────────
buildLegend();
applyFilters();
</script>
