  { id:"P-T05",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ If you had three more months, what specific aspect of your design would you change or improve — and why didn't you have time to do it this year?",
    note:"TRICK: tests intellectual honesty. A good answer identifies a specific technical gap rather than claiming everything is already optimal." },
  { id:"P-T06",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you handle disagreements within the team — can you give a specific example of a technical decision where team members disagreed, and how was it resolved?",
    note:"Conflict resolution is a professional skill; showing constructive debate (e.g., shear wall vs. braced frame argument) demonstrates team maturity." },
  { id:"P-T07",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did your faculty advisor contribute to your design process — were there specific decisions where their input changed your approach?",
    note:"Answer should not overstate advisor contribution; judges want student-driven work but acknowledge appropriate mentorship." },
  { id:"P-T08",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"What was the biggest single technical mistake you made during this project, and what did you learn from it?",
    note:"Admitting a mistake with a clear lesson demonstrates engineering maturity. Common examples: model setup errors discovered late, or joint failures during physical testing." },
  { id:"P-T09",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you ensure that each presenter could answer questions from all sections, not just their own? Judges may redirect follow-up questions to any team member.",
    note:"Cross-training is critical; each team member should be able to give a 60-second answer on any section covered in the presentation." },
  { id:"P-T10",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your architecture team and structural team worked independently for most of the project and integrated near the end. Are there any conflicts between the architectural design and the structural system that you were unable to fully resolve before the competition?",
    note:"TRICK: late integration commonly leaves unresolved tensions. An honest answer acknowledges specific compromises made under time pressure." },
  { id:"P-T11",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did your team decide on the architectural concept — was it driven by aesthetics, functionality, or was it selected because it simplified the structural challenge?",
    note:"The best concepts simultaneously satisfy architectural vision, structural efficiency, and sustainability goals." },
  { id:"P-T12",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"What software tools beyond SAP2000 or ETABS did your team use, and how were they integrated into the overall design workflow?",
    note:"Typical tools: SketchUp/Rhino (architecture), SAP/ETABS (analysis), Excel (financial/calculations), Python/MATLAB (post-processing)." },
  { id:"P-T13",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did being an international team — working across time zones or language differences — affect your collaboration, and what strategies helped?",
    note:"Applicable for international teams; time zone coordination, bilingual technical writing, and real-time collaboration tools are common solutions." },
  { id:"P-T14",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"What would you do differently in the physical construction phase if you could start over — what construction technique or assembly sequence would you change?",
    note:"Common improvements: use jigs from day one, laser-cut all members, test connections before full assembly, avoid gluing parts that need future adjustment." },
  { id:"P-T15",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You said your team worked well together and had no major problems — but looking at your physical model, there are visible asymmetries and construction imperfections compared to your CAD drawings. How did those construction errors affect predicted structural performance?",
    note:"TRICK: construction imperfections introduce unintended eccentricities and reduce member strength. A rigorous team acknowledges this and estimates the effect on results." },
  { id:"P-T16",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you document and archive your design decisions throughout the project — would a new team member joining halfway through be able to reconstruct the reasoning behind each key decision?",
    note:"Good documentation (decision logs, model version history, test reports) is a professional practice that distinguishes mature engineering teams." },
  { id:"P-T17",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you analyze the competition scoring rubric and allocate your team's effort — did you consciously prioritize high-weight scoring categories?",
    note:"Strategic scoring awareness is a legitimate competitive advantage; knowing which categories are worth more points informs resource allocation." },
  { id:"P-T18",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"What resources — lab access, equipment, software licenses — were most important for your team, and how did limited access to any of them constrain your design process?",
    note:"Shake table access is typically very limited and highly competitive; some teams build without any pre-competition physical testing." },
  { id:"P-T19",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you approach the weight-versus-performance trade-off — at what point did adding more structural material start hurting your score rather than helping?",
    note:"Competition penalizes weight; diminishing returns on added bracing appear when the weight penalty outweighs the performance benefit." },
  { id:"P-T20",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You said you are confident in your results — but you haven't seen any other team's results yet. On what objective basis are you confident, given that you have no comparative benchmark?",
    note:"TRICK: the correct basis for confidence is meeting code criteria (drift limits, acceleration limits), not comparison with other teams whose results are unknown." },

  // ── ADA & ACCESSIBILITY (20) ──────────────────────────────
  { id:"P-ADA01",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the minimum clear width required for an accessible corridor under ADA 2010 Standards, and do all corridors in your building meet that requirement?",
    note:"ADA 2010: 36-inch min for accessible routes; 44 inches for corridors in most commercial occupancies per IBC 2021." },
  { id:"P-ADA02",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:false,repeatGroup:null,repeatCount:0,
    question:"How many accessible parking spaces does your building provide, and what is the ADA minimum for your total parking count?",
    note:"ADA: 1 van-accessible space per 25 total spaces (minimum); van spaces require 8-foot access aisle and 98-inch vertical clearance." },
  { id:"P-ADA03",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your lobby entrance door has a 10-pound opening force — but ADA Standards limit exterior accessible door opening force to 5 pounds maximum. Does your entrance comply, and what is the simplest solution?",
    note:"TRICK: door opening force is a frequently overlooked ADA detail. Solution: automatic door opener or low-energy power operator." },
  { id:"P-ADA04",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the maximum slope for an accessible ramp under ADA 2010 Standards, and what is the maximum rise per ramp run before a level landing is required?",
    note:"ADA: max slope 1:12 (8.33%); max rise 30 inches per run; max run 30 feet; landings min 60×60 inches at top and bottom." },
  { id:"P-ADA05",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:false,repeatGroup:null,repeatCount:0,
    question:"How many accessible restrooms does each floor provide, and what specific ADA features are required — turning radius, grab bars, sink clearances?",
    note:"ADA restroom: 60-inch turning diameter, side transfer space, 33–36 inch grab bars, 27-inch knee clearance under sink." },
  { id:"P-ADA06",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does your elevator comply with ADA requirements — minimum cab dimensions, door clear width, button height range, and Braille signage?",
    note:"ADA elevator: 68×51 inch min cab, 36-inch door, buttons 15–48 inches AFF, auditory floor announcements, raised/Braille floor designations." },
  { id:"P-ADA07",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the accessible reach range for operable controls under ADA — light switches, electrical outlets, door hardware — and how does your design comply?",
    note:"ADA reach range: forward 15–48 inches AFF; side 9–54 inches AFF; operable parts cannot require tight grasping or twisting." },
  { id:"P-ADA08",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your building has a grand staircase as the primary architectural feature — but if both elevators are out of service after an earthquake, how do wheelchair users evacuate from upper floors?",
    note:"TRICK: IBC 2021 requires Areas of Refuge on every floor above grade for non-ambulatory occupants; these must be shown on floor plans." },
  { id:"P-ADA09",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you ensure the elevated walkway or sky bridge in your design is fully accessible — what is its slope, surface texture, and edge protection?",
    note:"Elevated walkways with any grade change must meet ramp requirements; non-slip surfaces and 4-inch min edge curbs required." },
  { id:"P-ADA10",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:false,repeatGroup:null,repeatCount:0,
    question:"Do your ground-floor restaurant or retail spaces comply with ADA requirements for accessible seating — and what percentage of each seating type must be accessible?",
    note:"ADA: minimum 5% or 1 of each seating type must be accessible; accessible routes must reach all service counters." },
  { id:"P-ADA11",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does your building address visual and auditory accessibility for occupants with sensory disabilities — visual alarms, Braille signage, and tactile wayfinding?",
    note:"ADA: visual (strobe) alarms supplementing auditory alarms; Braille and raised character signage; tactile warning strips at hazardous locations." },
  { id:"P-ADA12",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your rooftop deck is accessible by elevator and your drawings show a 1-inch raised threshold at the door and pavers with 1/4-inch joints. Are those features ADA-compliant?",
    note:"TRICK: raised thresholds above 1/2 inch and surface changes above 1/4 inch vertical are not ADA-compliant. These details are frequently overlooked in student designs." },
  { id:"P-ADA13",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:false,repeatGroup:null,repeatCount:0,
    question:"How many accessible residential units are required in the residential portion of your building under the Fair Housing Act, and what features distinguish them?",
    note:"Fair Housing Act (not ADA): 2% of ground-floor units fully accessible; 5% adaptable. Features: roll-under kitchen, wider doorways, reinforced walls for future grab bars." },
  { id:"P-ADA14",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:false,repeatGroup:null,repeatCount:0,
    question:"What counter height did you specify for service counters in retail or lobby areas — and at what height does ADA require at least a portion to be accessible?",
    note:"ADA: at least 36 inches of counter length at max 34 inches AFF with knee clearance below for forward approach." },
  { id:"P-ADA15",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does your exterior site plan address accessible parking, drop-off zones, and the accessible route from the sidewalk to the main building entrance?",
    note:"Accessible route: 36-inch min width, continuous, level (max 2% cross slope), free of protruding objects; connects parking/transit to building entry." },
  { id:"P-ADA16",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:false,repeatGroup:null,repeatCount:0,
    question:"Did you address ADA requirements for gym or recreational facilities — pool lifts, accessible equipment clearances, and accessible locker rooms?",
    note:"Pool lifts required for pools with 300+ linear feet of pool wall; accessible locker room needs roll-in shower and lockers at 48-inch max height." },
  { id:"P-ADA17",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your floor plan shows the accessible restroom on each floor is also the only unisex restroom. If it is occupied, there is no alternative for wheelchair users on that floor. Is that sufficient under ADA for a large commercial building?",
    note:"TRICK: ADA requires accessible toilet compartments within multi-user restrooms in addition to separate accessible/unisex facilities. A single unisex per floor is insufficient for high-occupancy buildings." },
  { id:"P-ADA18",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you address accessibility at the main entrance — door width, level landing on both sides, threshold height, and maneuvering clearance?",
    note:"Accessible entrance: 32-inch min clear width (36 preferred), 60×60 level landing both sides, max 1/2-inch threshold, 18-inch latch clearance on pull side." },
  { id:"P-ADA19",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the maximum protrusion distance for wall-mounted objects between 27 and 80 inches AFF, and how did your design address items at mid-wall height?",
    note:"ADA: max 4-inch protrusion from wall in the 27–80 inch range; cane-detectable barriers required below 27 inches for any larger overhangs." },
  { id:"P-ADA20",year:"PRACTICE",team:"Practice",category:"cat-ada",categoryLabel:"ADA & Accessibility",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You designed to comply with the ADA — but for an international team building in Seattle, what other local codes also apply? Are Washington State Building Code or Seattle Municipal Code accessibility provisions more stringent than federal ADA in any areas?",
    note:"TRICK: WSBC/IBC 2021 reference ICC A117.1-2017 which is sometimes more stringent than ADA. ADA is the federal floor; local codes can exceed it." },

  // ── MATERIAL PROPERTIES & TESTING (21) ────────────────────
  { id:"P-M01",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the elastic modulus of balsa wood parallel to the grain versus perpendicular to the grain, and why is this anisotropy critical for how you oriented your structural members?",
    note:"E_parallel ≈ 3–5 GPa; E_perpendicular ≈ 0.1–0.3 GPa — a 15–30× difference. Always load parallel to grain for maximum stiffness and strength." },
  { id:"P-M02",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you perform your three-point bending test — what span length did you use, where was the load applied, and what instruments measured deflection?",
    note:"E = PL³/(48δI); use span-to-depth ratio > 10 to minimize shear effects; measure deflection with dial gauge or digital caliper." },
  { id:"P-M03",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You tested 5 specimens to get an average elastic modulus and the coefficient of variation was 35%. Does that level of scatter justify using a single mean value in your structural model?",
    note:"TRICK: CV > 20% indicates high variability. A statistically rigorous approach uses a characteristic value (5th percentile) rather than the mean for a brittle material." },
  { id:"P-M04",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the modulus of rupture (bending strength) of the balsa wood you used, and how does it compare to the maximum bending stress in your critical members from SAP?",
    note:"Balsa MOR: 5–15 MPa. Safety factor = MOR / max bending stress from SAP; should be > 1 for all members." },
  { id:"P-M05",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did the density of your balsa wood strips affect your material selection decisions — did you weigh each strip before using it, or assign average density to all members?",
    note:"Balsa density: 100–350 kg/m³; higher density = higher strength but more weight, which is penalized in the competition." },
  { id:"P-M06",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you model the glue joints in SAP2000 — as perfect rigid connections, as pinned connections, or as semi-rigid connections with a stiffness value?",
    note:"Glue joints in balsa are typically semi-rigid; assuming perfect rigidity overestimates stiffness and fundamental frequency." },
  { id:"P-M07",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Balsa wood is brittle and fails suddenly without ductile yielding. If any member exceeds its elastic limit even briefly during competition shaking, it breaks catastrophically. Can you show that all members remain below the elastic limit under the worst ground motion in your suite?",
    note:"TRICK: linear analysis cannot capture post-yield behavior of brittle members. The team must show maximum stress < MOR with an adequate safety factor under the worst record." },
  { id:"P-M08",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you account for variability in balsa wood properties between different supplier batches used in your model?",
    note:"Different batches can have 20–40% variation in E; if multiple batches were used, each should be tested separately and assigned its own material property." },
  { id:"P-M09",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the tensile strength of the balsa wood you used, and did any structural member experience net tensile axial stress during the analysis?",
    note:"Balsa tensile strength ≈ 7–12 MPa; tension-side members (chord in bending, tension diagonals) must be checked against this limit." },
  { id:"P-M10",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,
    question:"What was the measured natural frequency of your physical model from the white noise sweep, and how did it compare to the SAP-computed frequency before and after model calibration?",
    note:"Before calibration SAP frequency is typically higher (stiffer) than physical; calibration via partial fixity or adjusted E brings them into agreement." },
  { id:"P-M11",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You used white noise to identify the natural frequency via FFT. If your model has two closely-spaced natural frequencies — say 4.0 Hz and 4.3 Hz — the FFT may not resolve them as separate peaks. Did you check for closely-spaced modes and their implications?",
    note:"TRICK: closely-spaced modes cause beating and can produce larger combined responses than SRSS predicts. They also indicate near-symmetric structural forms that are sensitive to small perturbations." },
  { id:"P-M12",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you measure and account for the mass of the glue in your total model weight and SAP mass model?",
    note:"Glue can add 5–15% of total model weight; if not included in mass calculation, the seismic weight and computed frequencies will be slightly off." },
  { id:"P-M13",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,
    question:"Did you test the shear strength of the balsa wood — particularly relevant for gusset plate connections and diagonal brace-to-column joints?",
    note:"Balsa shear strength ≈ 1–2 MPa parallel to grain; joints loaded in shear should be checked against this limit." },
  { id:"P-M14",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,
    question:"What cross-section dimensions did you choose for your columns, beams, and braces, and how did you size them from the SAP demand results?",
    note:"Section sizing: capacity = strength × section modulus or area; compare to maximum SAP demand with appropriate safety factor." },
  { id:"P-M15",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you cut your balsa members — hand cutting or laser cutting — and how did that choice affect dimensional accuracy and the fit of your structural joints?",
    note:"Laser cutting: ±0.1mm tolerance; hand cutting: ±1–2mm. Dimensional accuracy directly affects joint stiffness and overall model behavior." },
  { id:"P-M16",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You used a single average E for all balsa members regardless of density — but if your critical columns came from a denser batch than your braces, you may have underestimated column stiffness. How could that systematic error affect your model's predicted failure mode?",
    note:"TRICK: denser columns attract more load than modeled; softer braces shed load. The failure mode could shift from brace buckling to column failure." },
  { id:"P-M17",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,
    question:"What failure mode did you observe in any prototype test — member buckling, joint splitting, or base plate uplift — and how did you redesign to prevent it?",
    note:"Common balsa failures: column buckling (add lateral bracing), joint splitting (add gusset plates), base uplift (increase anchor points)." },
  { id:"P-M18",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you define connection fixity in your SAP model, and how did you physically achieve moment resistance at joints in the balsa model?",
    note:"Physical moment connections require overlap joints, gusset plates, or glued fillets to transfer moment; simple butt joints with glue are effectively pinned." },
  { id:"P-M19",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,
    question:"What load-bearing test did you perform on a prototype joint to verify it could carry the maximum force predicted by your SAP analysis?",
    note:"Joint pull-out or shear tests validate adhesive strength; the joint capacity measured should exceed the maximum force from SAP." },
  { id:"P-M20",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You assumed linear elastic material behavior using E measured at small strains. But balsa shows progressive stiffness reduction (softening) before fracture. If members experience any nonlinearity during the test, your linear SAP model will predict smaller displacements than actually occur. Have you quantified this potential underestimate?",
    note:"TRICK: this is a genuine limitation of linear elastic models for brittle solids. Best answer: show maximum predicted strain is well below the onset of nonlinearity in your stress-strain test data." },
  { id:"P-M21",year:"PRACTICE",team:"Practice",category:"cat-material",categoryLabel:"Material Properties & Testing",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you physically fabricate and test the base plate anchorage to ensure it would not fail under the uplift forces predicted by your SAP analysis?",
    note:"Base plate uplift is a top-3 failure mode; physical pull-out testing of the anchorage before competition day is best practice." }
,


  // ── STRUCTURAL SYSTEM B2 (20) ──────────────────────────────
  { id:"P-S22",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you decide on the number of bays in each direction — did your bay spacing come from structural efficiency, architectural module, or both?",
    note:"Bay spacing affects brace geometry, floor span, and damper placement. Structural module and architectural grid should be coordinated from the start." },
  { id:"P-S23",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:false,repeatGroup:null,repeatCount:0,
    question:"Did you check the slenderness ratio (KL/r) of your brace members against AISC 341 seismic limits, and what was the maximum ratio you found?",
    note:"AISC 341 limits brace slenderness to KL/r ≤ 200 for SCBF; for balsa, the low E makes this a frequently critical check." },
  { id:"P-S24",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You said the perimeter frame carries all the lateral load — but your floor plan shows interior columns too. Under seismic loading, won't the interior columns attract force through compatibility even if they're 'designed' as gravity-only?",
    note:"TRICK: gravity columns in a building with a stiff diaphragm get dragged along and attract axial and bending forces through kinematic compatibility. They must be detailed as 'gravity columns participating in lateral system'." },
  { id:"P-S25",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does your structural system transfer lateral load from the roof level down to the foundation — describe the complete vertical load path step by step?",
    note:"Full load path: roof diaphragm → collectors → braces/shear walls → floor diaphragms → base → foundation → ground. Any weak link is a failure point." },
  { id:"P-S26",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:false,repeatGroup:null,repeatCount:0,
    question:"Did you consider construction sequence in your design — are there any stages during construction where the partially completed structure is more vulnerable than the finished building?",
    note:"During construction, floors act as temporary diaphragms only after decking is complete; the structure may be more flexible at intermediate stages." },
  { id:"P-S27",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you handle the connection between Zone 1 and Zone 2 of the building — what structural element transfers forces across that interface?",
    note:"Zone transitions require robust collector elements and diaphragm continuity; this is one of the most commonly under-designed details in SDC buildings." },
  { id:"P-S28",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your building uses a buckling-restrained brace (BRB) system. BRBs are designed to yield in both tension and compression — but the concrete-filled steel tube casing must be designed to prevent global buckling. How did you verify the casing was adequate?",
    note:"TRICK: the BRB casing must be sized so its elastic buckling load exceeds the BRB's maximum compression force. Teams often design the core but forget the casing check." },
  { id:"P-S29",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:false,repeatGroup:null,repeatCount:0,
    question:"Did you run an eigenvalue analysis to check for any buckling modes below your design load — were there any unexpected local or global buckling modes?",
    note:"Eigenvalue (linear buckling) analysis can reveal unexpected failure modes; the first buckling mode load factor should be well above 1.0 for the design load." },
  { id:"P-S30",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you size the foundation mat or pile cap to resist the maximum overturning moment calculated from your time history analysis?",
    note:"Overturning moment = base shear × building height; resisted by couple forces (tension uplift on windward pile group, compression on leeward)." },
  { id:"P-S31",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:false,repeatGroup:null,repeatCount:0,
    question:"Your building has a setback at a mid-level floor — how does that geometric irregularity affect the lateral stiffness distribution and where do you expect the maximum drift to concentrate?",
    note:"Setbacks create stiffness discontinuities; the floor immediately above the setback often has the highest inter-story drift." },
  { id:"P-S32",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You said your building's lateral system is very efficient because it minimises material use. But the most material-efficient structure is also the least redundant — if one brace fails, does your system have an alternative load path to prevent progressive collapse?",
    note:"TRICK: efficiency and redundancy are in tension. A fully optimised (minimum material) system has no reserve capacity; progressive collapse check requires at least one alternative load path." },
  { id:"P-S33",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you account for accidental torsion in your analysis — ASCE 7-22 requires consideration of a 5% mass eccentricity even if your structure appears symmetric?",
    note:"5% accidental eccentricity adds torsional demands to all lateral elements; some software applies it automatically, others require manual input." },
  { id:"P-S34",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the redundancy factor (ρ) for your structure per ASCE 7-22, and how does it affect your design seismic forces?",
    note:"ρ = 1.0 for highly redundant systems; 1.3 for less redundant systems. It is a direct multiplier on seismic design forces." },
  { id:"P-S35",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does the concrete core or elevator shaft interact with your perimeter moment frame or braced frame — do they act as parallel lateral systems sharing the base shear?",
    note:"Two parallel lateral systems share base shear in proportion to their relative stiffness; the stiffer system attracts more load." },
  { id:"P-S36",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You designed your columns using the elastic forces from SAP analysis. But for capacity-protected elements in a seismic system, ASCE 7-22 requires columns to be designed for the maximum forces that the yielding elements (braces or beams) can deliver — not just the elastic analysis forces. Did you apply capacity design to your columns?",
    note:"TRICK: capacity design requires columns to be designed for ΩₒQₑ (amplified seismic forces) not just Qₑ. Using elastic SAP forces alone under-designs columns in a yielding system." },
  { id:"P-S37",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you verify that your physical balsa model's weight matched your SAP mass model within an acceptable tolerance?",
    note:"Weighing the physical model and comparing to SAP mass assignment is a basic quality check; discrepancies affect frequency predictions." },
  { id:"P-S38",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:false,repeatGroup:null,repeatCount:0,
    question:"What was the maximum axial force in your critical column under the design earthquake, and what was the demand-to-capacity ratio?",
    note:"D/C ratio should be < 1.0; for capacity-protected columns, the check uses amplified forces. Have this number ready." },
  { id:"P-S39",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:false,repeatGroup:null,repeatCount:0,
    question:"Did you consider the effect of the floor slab or diaphragm on the stiffness of your beam-column joints — does composite action change your frame stiffness significantly?",
    note:"Composite slab action stiffens beams and changes the effective moment of inertia; this shifts the fundamental period." },
  { id:"P-S40",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:false,repeatGroup:null,repeatCount:0,
    question:"How would your structural system perform under wind loading compared to seismic — which load case governed the design of your lateral system?",
    note:"In Seattle, seismic typically governs for mid-rise and taller buildings; wind governs for low-rise buildings and slender towers above ~40 stories." },
  { id:"P-S41",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You said the building satisfies all ASCE 7-22 drift limits. But the drift limit in ASCE 7-22 is a life-safety check at the design earthquake level — not a damage-control check at the service level. At what smaller, more frequent earthquake would your building start experiencing non-structural damage?",
    note:"TRICK: ASCE 7-22 drift limits are for the Design Earthquake (10% in 50 year), not for service level (50% in 50 year). Non-structural damage (partitions, facades) typically starts at ~0.3–0.5% drift." },

  // ── DAMPING SYSTEM B2 (20) ─────────────────────────────────
  { id:"P-D22",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the difference between viscous damping, viscoelastic damping, and hysteretic damping — and which mechanism does your device primarily exploit?",
    note:"Viscous: force proportional to velocity; viscoelastic: combined stiffness and damping; hysteretic: energy dissipation through plastic cycling (BRBs, yielding plates)." },
  { id:"P-D23",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"How do you experimentally measure the energy dissipated by your damper per cycle — what test would you run and what data would you record?",
    note:"Cyclic displacement test: measure force-displacement hysteresis loop area = energy dissipated per cycle. Repeat at several amplitudes and frequencies." },
  { id:"P-D24",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your oobleck (non-Newtonian fluid) damper works well under slow loading but behaves like a solid under rapid impact. During a high-frequency ground motion, would your damper actually be stiffer than the braces it's connected to — and what would that do to the brace forces?",
    note:"TRICK: non-Newtonian fluid dampers can transition from fluid-like to solid-like behavior at high strain rates, effectively becoming rigid and transferring full forces to braces. This must be checked under high-frequency content records." },
  { id:"P-D25",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does the damping ratio from your supplemental damper add to the inherent structural damping — can you simply add the two percentages, or is the combination more complex?",
    note:"Supplemental and inherent damping are added using the simplified energy method or the modal strain energy method — simple addition is only an approximation." },
  { id:"P-D26",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"What stroke (maximum displacement across the damper) did you design for, and how does it compare to the maximum relative displacement across that story from your SAP analysis?",
    note:"Damper stroke capacity must exceed maximum relative displacement demand with some margin; if the device bottoms out, it becomes rigid and overloads adjacent members." },
  { id:"P-D27",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"If you were to increase the number of dampers by 50%, what would be the diminishing return — at what number of dampers does adding more provide negligible additional performance benefit?",
    note:"Effective damping follows the equation ξ_total = ξ_inherent + ξ_supplemental; the relationship between damper count and ξ_supplemental is not always linear due to mode shape effects." },
  { id:"P-D28",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your dampers are positioned in the horizontal direction only. But during a 3D earthquake, the building also twists. Does your horizontal damper configuration provide any resistance to torsional response, or do you need additional dampers in a different configuration?",
    note:"TRICK: dampers placed symmetrically resist translation but not torsion. To damp torsional modes, dampers must be placed asymmetrically or in an outrigger configuration." },
  { id:"P-D29",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"How do your dampers behave under wind loading — do they provide meaningful wind-induced vibration control, or are they sized primarily for seismic?",
    note:"Viscous dampers sized for seismic (large displacement, large velocity) may not activate meaningfully under wind (small displacement); TMDs are often better for wind." },
  { id:"P-D30",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the maximum force your damper can develop, and how does that force compare to the capacity of the brace or connection it is attached to?",
    note:"The damper maximum force is C × v_max; this force must not exceed the capacity of the connecting structural members." },
  { id:"P-D31",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"How would you retrofit your damping system if the competition shake table test showed the device was underperforming relative to predictions?",
    note:"Retrofit options: increase C value (stiffer fluid or larger piston), add dampers at additional floors, recalibrate the TMD tuning frequency." },
  { id:"P-D32",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You said your dampers reduce peak displacement by 30%. But for the competition scoring, the judges measure absolute floor acceleration, not just displacement. Does a 30% displacement reduction translate to a similar reduction in peak floor acceleration — and why might it not?",
    note:"TRICK: damping reduces velocity-driven response (affecting displacement more than acceleration for high-frequency modes). Peak floor acceleration is dominated by higher-mode contributions which may not be significantly reduced by dampers tuned to the first mode." },
  { id:"P-D33",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the damping ratio contribution from your device when expressed as a percentage of critical damping — and is that value consistent across all floors or does it vary by location?",
    note:"Supplemental damping ratio varies by mode and floor; the effective damping in the first mode is typically higher than in higher modes for dampers placed at optimal locations." },
  { id:"P-D34",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"Did you verify that the velocity your damper experiences during the competition matches the velocity range it was designed for — too slow and it barely activates, too fast and it may exceed its stroke?",
    note:"Velocity compatibility is critical: check peak inter-story velocity from THA against damper velocity range specification." },
  { id:"P-D35",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does your damper affect the building during aftershocks — would it still be effective if the fluid partially leaked or the friction surface wore during the main event?",
    note:"Post-earthquake residual damper capacity is a lifecycle consideration; viscous fluid leakage and friction surface wear both reduce effectiveness in aftershocks." },
  { id:"P-D36",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"Compare the mass of your damping system to the total structural mass — what percentage of total model weight do the dampers represent?",
    note:"For competition purposes, damper mass contributes to the weight penalty; teams should know this ratio and justify the weight investment." },
  { id:"P-D37",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You placed all your dampers on the same floor level. If that specific floor experiences an unexpected early failure due to concentration of forces, would the loss of all dampers simultaneously make the situation worse than having no dampers at all?",
    note:"TRICK: concentrating dampers on one floor creates a single point of failure for the entire damping system. Distributed placement across multiple floors provides better redundancy." },
  { id:"P-D38",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you document the fabrication process for your damper so that it could be reproduced reliably — what tolerances are critical for consistent performance?",
    note:"Fabrication documentation is important for reproducibility; critical tolerances include piston clearance, fluid fill volume, and friction surface finish." },
  { id:"P-D39",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the fundamental difference between a passive, semi-active, and active damping system — why did you choose passive over the other options for this competition?",
    note:"Passive: no external energy input, always stable; semi-active: adjustable properties, low power; active: external force, risk of instability. Passive is chosen for simplicity, cost, and reliability." },
  { id:"P-D40",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"Does your damper add any stiffness to the structural system in addition to damping — and if so, how did you account for that added stiffness in your SAP model?",
    note:"Viscoelastic and friction dampers add both stiffness and damping. This stiffness contribution shifts the natural period and must be included in the analytical model." },
  { id:"P-D41",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You said the dampers will reduce the inter-story drift from 0.8% to 0.5%. But if both values are well below the 2% ASCE 7-22 limit, the practical benefit to life-safety is marginal. Why is the added complexity and cost of dampers justified when a simpler stiffer structure would also meet code?",
    note:"TRICK: this is a design philosophy question. Valid justifications include: performance-based design objectives beyond code minimum, reduced non-structural damage, acceleration reduction, and architectural freedom from stiffer elements." },

  // ── GEOTECHNICAL B2 (20) ──────────────────────────────────
  { id:"P-G22",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you determine whether your site requires a site-specific ground motion hazard analysis versus using the standard ASCE 7-22 mapped values?",
    note:"Site-specific analysis is required for Site Class F, irregular sites, and structures with T > 5s. For most SDC buildings, mapped values suffice." },
  { id:"P-G23",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the significance of the transition period Ts in the design spectrum, and where does your building's fundamental period sit relative to Ts?",
    note:"Ts = SD1/SDS; periods below Ts are in the constant acceleration region; above Ts are in the constant velocity region. Period relative to Ts affects which hazard parameter governs design." },
  { id:"P-G24",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You used SPT N-values to estimate Vs30 and classify the site. But SPT data has significant uncertainty — hammer energy ratios can vary ±30% between rigs. How did that uncertainty affect your site class confidence?",
    note:"TRICK: SPT is inherently variable; energy correction factors (CE, CB, CR, CS) must be applied to get N60. Uncorrected N values can misclassify a site by one or even two classes." },
  { id:"P-G25",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"What are the specific SPT N-value thresholds used in ASCE 7-22 to distinguish between Site Classes C, D, and E?",
    note:"ASCE 7-22: Site Class C: N̄ > 50 blows/ft; Site Class D: 15 ≤ N̄ ≤ 50; Site Class E: N̄ < 15. (Average over top 30m / 100 ft)" },
  { id:"P-G26",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"How would a change in site class from D to E affect your design spectral acceleration values SDS and SD1, and consequently your base shear?",
    note:"Site Class E has higher Fa and Fv multipliers than D; this increases SMS, SM1, SDS, SD1, and therefore the design base shear. Know the magnitude of this increase." },
  { id:"P-G27",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the cyclic stress ratio (CSR) at your site, and how did you calculate it from the peak ground acceleration and the effective vertical stress?",
    note:"CSR = 0.65 × (σv/σ'v) × (amax/g) × rd, where rd is the stress reduction factor. This must be compared to CRR to assess liquefaction triggering." },
  { id:"P-G28",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your liquefaction analysis used the Design Earthquake PGA (2/3 × MCER). But the Seed-Idriss simplified method was originally developed for the maximum considered earthquake. By using the design level PGA, are you potentially underestimating liquefaction triggering?",
    note:"TRICK: liquefaction assessment should use MCER-level shaking, not design-level, because liquefaction is a maximum considered hazard. Using 2/3 PGA under-predicts CSR and may miss triggering." },
  { id:"P-G29",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you estimate the settlement that would occur if liquefaction were triggered — and is that post-liquefaction settlement tolerable for your foundation system?",
    note:"Post-liquefaction settlement can be estimated from Zhang et al. (2002) using the factor of safety against liquefaction and volumetric strain; pile foundations may tolerate it better than spread footings." },
  { id:"P-G30",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"What ground improvement technique did you specify to mitigate liquefaction, and what is the mechanism by which that technique increases the factor of safety?",
    note:"Common methods: densification (vibro-compaction increases N-values), drainage (stone columns lower excess pore pressure), grouting (increases strength directly)." },
  { id:"P-G31",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"How deep does the potentially liquefiable layer extend below the surface, and what is the consequence of that depth for your pile design?",
    note:"Piles must extend below the liquefiable layer to reach competent material; within the liquefiable zone, piles lose lateral support and must be designed for buckling." },
  { id:"P-G32",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your boring logs show a thin clay layer between two sand layers. During liquefaction of the lower sand layer, can the excess pore water pressure migrate upward through the clay and trigger liquefaction in the upper sand layer as well?",
    note:"TRICK: pore pressure migration through low-permeability layers is a documented mechanism ('hydraulic fracturing' of the clay); it can trigger liquefaction at shallower depths than the direct seismic demand alone would predict." },
  { id:"P-G33",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you account for the effect of the existing underground structures near your site — does the presence of the light rail tunnel change the effective stress state or drainage conditions in the surrounding soil?",
    note:"Underground structures alter the stress distribution and may create drainage barriers; these effects should be considered in the geotechnical analysis." },
  { id:"P-G34",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the approximate shear modulus G of your site soils at small strain, and how does it degrade with increasing shear strain during seismic shaking?",
    note:"G_max = ρ × Vs²; modulus degradation curves (Seed & Idriss, Vucetic & Dobry) show G reduction to 20-50% of G_max at moderate seismic strains." },
  { id:"P-G35",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"How would you explain the difference between primary and secondary (creep) consolidation to a client — and which is more relevant for the long-term performance of your building?",
    note:"Primary consolidation: excess pore water drains, time-dependent; secondary: creep of soil skeleton under constant effective stress. Secondary dominates in organic soils and clays." },
  { id:"P-G36",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You designed your pile caps based on the assumption that the piles act as a rigid group. But for widely-spaced piles, individual pile behavior may differ significantly from group behavior due to 'pile group efficiency'. Did you account for reduced group efficiency in your pile capacity calculation?",
    note:"TRICK: pile group efficiency factor (η < 1) reduces the total group capacity below the sum of individual pile capacities due to stress overlap in the soil. This is often ignored in simplified pile group designs." },
  { id:"P-G37",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the coefficient of earth pressure at rest (K₀) for your site soils, and how does it affect the lateral pressure on your basement walls or below-grade structure?",
    note:"K₀ = 1 - sin(φ') for normally consolidated soils; affects design of basement retaining walls and underground structure lateral loads." },
  { id:"P-G38",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you verify that your soil boring data is representative of the full site — what criteria did you use to decide that additional borings were not needed?",
    note:"Boring adequacy criteria: site variability, soil complexity, building footprint size; 2 borings per 1000 sqm is a common rule of thumb." },
  { id:"P-G39",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the relationship between the Seismic Design Category (SDC) of your building and the geotechnical investigation requirements under ASCE 7-22?",
    note:"Higher SDC (D, E, F) require more thorough geotechnical investigation including liquefaction assessment and site-specific Vs30 measurement." },
  { id:"P-G40",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"If your site were classified as Site Class F (peats, highly sensitive clays, liquefiable soils, or soft/medium stiff clays >100ft deep), what special requirements would ASCE 7-22 impose on your analysis?",
    note:"Site Class F requires a site-specific ground response analysis to develop the design spectrum; the standard mapped Fa and Fv values cannot be used." },
  { id:"P-G41",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You designed for Site Class D. But if during construction the excavation reveals unexpected soft clay pockets not captured by the boring logs, and those pockets indicate Site Class E conditions — what would be the design and contractual implications of that site class reclassification mid-project?",
    note:"TRICK: site class reclassification mid-project increases design forces and may require redesign of foundations and structural elements, leading to cost and schedule impacts. This is why adequate pre-design investigation is essential." },

  // ── GROUND MOTION SELECTION B2 (21) ───────────────────────
  { id:"P-GM22",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the difference between spectral acceleration (Sa), pseudo-spectral acceleration (PSa), and absolute spectral acceleration — and which does ASCE 7-22 use as its intensity measure?",
    note:"PSa ≈ ω² × Sd for linear SDOF; absolute Sa includes the ground acceleration contribution. ASCE 7-22 uses 5%-damped PSa as the standard intensity measure." },
  { id:"P-GM23",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does the USGS Unified Hazard Tool (UHT) generate a hazard curve, and what information does the hazard curve give you that a single design spectrum cannot?",
    note:"A hazard curve shows probability of exceedance vs. spectral acceleration for a specific period; it enables performance-based design at multiple hazard levels." },
  { id:"P-GM24",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You said you used 'spectrum-compatible' records. But spectrum-compatible records created by spectral matching have artificially suppressed variability — they all look very similar and may not represent the true record-to-record variability. Does using matched records underestimate the scatter in your response predictions?",
    note:"TRICK: spectrum-matched records reduce record-to-record variability (σ), leading to artificially tight response distributions. Lightly matched records (natural records scaled to target) better represent true variability." },
  { id:"P-GM25",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the Arias intensity of your ground motions, and how does it relate to the potential for liquefaction and structural damage?",
    note:"Arias intensity (Ia) captures the cumulative energy of the record; it correlates well with damage potential and liquefaction triggering for soft soils." },
  { id:"P-GM26",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"How do you account for the vertical-to-horizontal spectral ratio when selecting records — and at what distance from the fault does vertical ground motion become significant?",
    note:"V/H ratio approaches 1.0 within 10-15 km of the fault; at greater distances V/H ≈ 0.5–0.7. Vertical component matters for near-fault sites and long-span elements." },
  { id:"P-GM27",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the difference between ground motion selection for nonlinear response history analysis and for linear response spectrum analysis in terms of what characteristics matter most?",
    note:"For linear RSA: spectral shape at T₁ matters most. For nonlinear NLRHA: record duration, cumulative ductility demand, and spectral shape over a wide period range all matter." },
  { id:"P-GM28",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ The competition provided a mandatory Ground Motion 1 that is a near-fault record with a strong velocity pulse. You selected 10 additional records without velocity pulses to fill out your suite of 11. By averaging the results, aren't you diluting the effect of the near-fault pulse that is actually the most damaging record for your site?",
    note:"TRICK: for near-fault sites, the pulse-type record often produces the maximum response. Averaging it with 10 non-pulse records underweights its contribution to the mean response." },
  { id:"P-GM29",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the significant duration (D5-75 or D5-95) of your ground motions, and how does it relate to the magnitude and distance of the earthquake source?",
    note:"D5-75 is the time between 5% and 75% of Arias intensity; longer duration correlates with larger magnitude and closer distance for subduction events." },
  { id:"P-GM30",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"How would you explain the concept of 'spectral shape' to a non-specialist judge — and why does matching spectral shape matter more than matching PGA alone?",
    note:"Spectral shape describes how the ground motion's frequency content distributes energy across periods. A record with matching PGA but wrong shape (too much energy at wrong period) can over- or under-predict structural response." },
  { id:"P-GM31",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"Did you check whether any of your selected ground motions were recorded on similar site conditions to yours — and why does recording site condition matter for record selection?",
    note:"Records from similar site conditions naturally have compatible amplification patterns; using records from rock sites for a soft soil site can miss site amplification effects." },
  { id:"P-GM32",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ The competition's mandatory Ground Motion 2 has a very short duration of strong shaking (D5-95 = 8 seconds). For a structure that will take 15+ cycles to fully mobilise its dampers, does this short-duration record actually represent a worst case — or might a longer-duration record from a subduction event be more damaging?",
    note:"TRICK: short crustal records may not mobilise full damper capacity or cyclic degradation. Long-duration subduction records can produce more cumulative damage in ductile systems despite lower peak spectral acceleration." },
  { id:"P-GM33",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the difference between the MCER risk-targeted ground motion and the Deterministic Lower Limit (DLL) in ASCE 7-22, and which governed your spectral values?",
    note:"MCER is the smaller of the probabilistic (risk-targeted) and 150% of deterministic ground motion. Near active faults, the deterministic cap often governs." },
  { id:"P-GM34",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you use the PEER NGA-West2 database search filters — what parameters did you specify, and how many candidate records did the initial search return before you narrowed to 11?",
    note:"Typical filters: magnitude range (Mw 6.0–8.0), distance range (based on deaggregation), Vs30 range (site class), style of faulting. Initial searches often return 50–200 candidates." },
  { id:"P-GM35",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does the spectral acceleration at long periods (T > 2s) affect your building — and did you check that your ground motion suite adequately represents the long-period hazard?",
    note:"Long-period spectral content drives the response of higher floors (higher modes) and matters for tall buildings with T > 1s." },
  { id:"P-GM36",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You selected all 11 records to match the same target spectrum. But if your structural design changed significantly after record selection (e.g., the period shifted from 0.3s to 0.5s due to design iterations), your previously selected records may no longer be well-matched at the new fundamental period. Did you re-check your record selection after the final design was fixed?",
    note:"TRICK: ground motion selection depends on T₁. If the design changes significantly, records should be re-evaluated. Running analysis with mismatched records can give non-conservative results." },
  { id:"P-GM37",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is a ground motion intensity measure (IM), and why is the choice of IM important for the efficiency and sufficiency of your record selection?",
    note:"An efficient IM has low record-to-record variability; a sufficient IM is uncorrelated with other ground motion characteristics. Sa(T₁) is efficient but not sufficient; Sa_avg over a period range is more sufficient." },
  { id:"P-GM38",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does the competition's requirement to predict floor accelerations at specific locations change your ground motion selection strategy compared to simply predicting peak roof displacement?",
    note:"Floor acceleration prediction is sensitive to higher modes; records should be matched not just at T₁ but over a range of shorter periods that excite higher modes." },
  { id:"P-GM39",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"Can you explain what 'ground motion record-to-record variability' means and how the standard deviation of response predictions from 11 records is used to assess prediction confidence?",
    note:"Record-to-record variability (σ_ln) is the standard deviation of ln(response) over the suite; 68% of responses fall within ±1σ of the mean. Larger σ means less confident predictions." },
  { id:"P-GM40",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"What tool or software did your team use to compute the design spectrum from the USGS hazard data, and how did you verify the computed values matched the ASCE 7-22 parameters for your site?",
    note:"ATC Hazards by Location tool or ASCE 7 Hazard Tool directly outputs SDS, SD1, and the design spectrum. Cross-checking against USGS UHT output is a good verification step." },
  { id:"P-GM41",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your team applied the same 11 ground motions in both the X and Y directions simultaneously, rotating each record 90° for the Y direction. But ground motion coherence between the two horizontal components is not 90° by definition — you may have artificially created correlated input that does not match real earthquake physics. How does this affect your torsional response predictions?",
    note:"TRICK: real 3D earthquake records have naturally correlated horizontal components; applying one record at 0° and the same record at 90° creates artificial coherence. The correct approach uses both recorded horizontal components of a 3-component record." },
  { id:"P-GM42",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the Uniform Hazard Spectrum (UHS) and how does it differ from the Risk-Targeted Maximum Considered Earthquake (MCER) spectrum in ASCE 7-22?",
    note:"UHS: each period independently set at same probability of exceedance — conservative because simultaneous peaking is physically impossible. MCER: risk-targeted to achieve uniform 1% collapse risk in 50 years — more physically realistic." },

  // ── ANALYSIS & PERFORMANCE B2 (21) ────────────────────────
  { id:"P-A22",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you check whether your response spectrum analysis results were conservative relative to your time history analysis results — and by what percentage did they differ?",
    note:"RSA typically overestimates slightly due to SRSS/CQC modal combination conservatism; THA captures time-domain cancellation effects. Compare peak values from both methods." },
  { id:"P-A23",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"What are the CQC and SRSS modal combination rules, and in what circumstances would you use one over the other for a response spectrum analysis?",
    note:"SRSS: appropriate when modes are well-separated; CQC: required when modal frequencies are closely-spaced (within 10% of each other). CQC is always the safer choice." },
  { id:"P-A24",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your SAP model shows first-mode mass participation of 85% in X but only 62% in Y. You ran the analysis with 10 modes. Is 62% participation adequate for ASCE 7-22 compliance, and what does the low Y-direction participation imply about the building's dynamic behaviour?",
    note:"TRICK: ASCE 7-22 requires 90% mass participation; 62% is insufficient. Low participation in Y suggests torsionally-coupled modes or closely-spaced Y-direction modes that aren't being captured in the first few modes." },
  { id:"P-A25",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you apply the Rayleigh damping matrix in SAP — which two frequencies did you use to anchor the damping curve, and why did you choose those specific frequencies?",
    note:"Rayleigh damping is anchored at two frequencies to achieve target damping ξ = 5%; typically anchored at ω₁ (first mode) and ω_n (dominant higher mode). Between the anchor points, damping is close to target; outside, it diverges." },
  { id:"P-A26",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you extract peak floor accelerations from your time history analysis — did you use the envelope of absolute acceleration at each node, or an average over a floor plate?",
    note:"Peak absolute acceleration at nodes is the most conservative; averaging across the floor represents the overall floor motion more realistically for non-structural component design." },
  { id:"P-A27",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"How do you define 'amplification factor' in the context of floor acceleration — and how does your building's floor acceleration at the roof compare to the input PGA?",
    note:"Amplification factor = peak floor acceleration / PGA. For a linear elastic building, amplification at roof can reach 3–5× PGA for the dominant mode frequency." },
  { id:"P-A28",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You showed that the mean peak roof displacement from your 11 ground motions is 15mm. But the standard deviation is 12mm, giving a coefficient of variation of 80%. Should you report the mean as your prediction, or would the 84th percentile (mean + 1σ) be a more appropriate design value?",
    note:"TRICK: high variability (CoV > 40%) makes the mean a poor representation of the central tendency. For design purposes, mean + 1σ (84th percentile) is more appropriate and reflects expected maximum response." },
  { id:"P-A29",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"How would the nonlinear geometric effects (large-displacement formulation) change your analysis results if you turned on P-delta in SAP compared to the linear geometric assumption?",
    note:"P-delta increases effective lateral displacement and reduces effective lateral stiffness; the effect grows as the building deflects more. Critical for tall, flexible buildings." },
  { id:"P-A30",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you check that the numerical time integration in your THA was stable — did you observe any energy growth or spurious oscillation in the free-vibration response after the ground motion stopped?",
    note:"After input ends, the response should decay smoothly; energy growth or non-decaying oscillations indicate numerical instability, usually fixed by reducing the time step." },
  { id:"P-A31",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the relationship between your structure's fundamental period and the dominant period of the ground motion — are they close to resonance, and how did you assess that risk?",
    note:"Resonance occurs when T_structure ≈ T_dominant_input; spectral shape around T_structure shows whether amplification is expected. Resonance significantly increases response." },
  { id:"P-A32",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your SAP model shows that the third floor has a lower acceleration than the second and fourth floors. That non-monotonic distribution seems physically odd — can you explain what physical mechanism could cause an acceleration dip at an intermediate floor?",
    note:"TRICK: a non-monotonic acceleration profile can be caused by destructive interference between the first and second mode contributions at a specific floor, or by a stiffness concentration that acts as a local isolator." },
  { id:"P-A33",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you determine the ductility demand on your most critical structural member — and does that demand exceed the available ductility capacity?",
    note:"Ductility demand = maximum displacement / yield displacement for that member. For brittle balsa, yield displacement ≈ elastic limit displacement. Demand must be below capacity." },
  { id:"P-A34",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does your building's seismic performance change between Ground Motion 1 and Ground Motion 2 — which record produces the worse outcome for each performance metric?",
