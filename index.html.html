<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDC Judge Question Bank</title>
<style>
  :root {
    --bg: #f8f7f4;
    --surface: #ffffff;
    --border: #e2e0db;
    --border-strong: #c8c5be;
    --text: #1a1917;
    --text-muted: #6b6860;
    --text-light: #9a978f;
    --accent: #1a3a5c;
    --accent-light: #e8eef5;

    --cat-structural: #1a3a5c;
    --cat-structural-bg: #e8eef5;
    --cat-damping: #5c1a3a;
    --cat-damping-bg: #f5e8ef;
    --cat-geotech: #1a5c3a;
    --cat-geotech-bg: #e8f5ee;
    --cat-ground: #5c3a1a;
    --cat-ground-bg: #f5ede8;
    --cat-analysis: #3a1a5c;
    --cat-analysis-bg: #ede8f5;
    --cat-arch: #1a5c5c;
    --cat-arch-bg: #e8f5f5;
    --cat-financial: #5c5c1a;
    --cat-financial-bg: #f5f5e8;
    --cat-team: #5c4a1a;
    --cat-team-bg: #f5f0e8;
    --cat-ada: #3a5c1a;
    --cat-ada-bg: #eef5e8;
    --cat-material: #4a1a5c;
    --cat-material-bg: #f2e8f5;

    --repeat-bg: #fff3cd;
    --repeat-color: #7a5a00;
    --hot-bg: #ffe0e0;
    --hot-color: #8b0000;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
  }

  header {
    background: var(--accent);
    color: #fff;
    padding: 2rem 2.5rem 1.5rem;
  }

  header h1 {
    font-family: 'Courier New', monospace;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #fff;
    margin-bottom: 0.3rem;
  }

  header p {
    font-size: 0.88rem;
    color: rgba(255,255,255,0.7);
    font-family: 'Courier New', monospace;
  }

  .stats-bar {
    display: flex;
    gap: 2rem;
    padding: 1rem 2.5rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .stat-num {
    font-family: 'Courier New', monospace;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }

  .stat-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .controls {
    padding: 1rem 2.5rem;
    background: var(--surface);
    border-bottom: 2px solid var(--border-strong);
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    align-items: center;
  }

  .controls input[type="text"] {
    flex: 1;
    min-width: 200px;
    padding: 0.45rem 0.75rem;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 0.82rem;
    background: var(--bg);
    color: var(--text);
  }

  .controls select {
    padding: 0.45rem 0.6rem;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 0.82rem;
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
  }

  .controls label {
    font-family: 'Courier New', monospace;
    font-size: 0.78rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 0.4rem;
    cursor: pointer;
  }

  .controls input[type="checkbox"] {
    width: 14px;
    height: 14px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .results-info {
    padding: 0.6rem 2.5rem;
    font-family: 'Courier New', monospace;
    font-size: 0.78rem;
    color: var(--text-muted);
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }

  .question-list {
    padding: 1.5rem 2.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.9rem 1rem 0.9rem 1.1rem;
    border-left: 4px solid var(--border-strong);
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
  }

  .q-card.cat-structural { border-left-color: var(--cat-structural); }
  .q-card.cat-damping { border-left-color: var(--cat-damping); }
  .q-card.cat-geotech { border-left-color: var(--cat-geotech); }
  .q-card.cat-ground { border-left-color: var(--cat-ground); }
  .q-card.cat-analysis { border-left-color: var(--cat-analysis); }
  .q-card.cat-arch { border-left-color: var(--cat-arch); }
  .q-card.cat-financial { border-left-color: var(--cat-financial); }
  .q-card.cat-team { border-left-color: var(--cat-team); }
  .q-card.cat-ada { border-left-color: var(--cat-ada); }
  .q-card.cat-material { border-left-color: var(--cat-material); }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    flex-wrap: wrap;
  }

  .q-id {
    font-family: 'Courier New', monospace;
    font-size: 0.72rem;
    color: var(--text-light);
    min-width: 45px;
    padding-top: 2px;
  }

  .q-text {
    flex: 1;
    font-size: 0.92rem;
    color: var(--text);
    line-height: 1.55;
  }

  .q-meta {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    align-items: center;
    padding-left: 52px;
  }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 3px;
    font-family: 'Courier New', monospace;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  .badge-cat {
    background: var(--cat-structural-bg);
    color: var(--cat-structural);
  }
  .badge-cat.cat-structural { background: var(--cat-structural-bg); color: var(--cat-structural); }
  .badge-cat.cat-damping { background: var(--cat-damping-bg); color: var(--cat-damping); }
  .badge-cat.cat-geotech { background: var(--cat-geotech-bg); color: var(--cat-geotech); }
  .badge-cat.cat-ground { background: var(--cat-ground-bg); color: var(--cat-ground); }
  .badge-cat.cat-analysis { background: var(--cat-analysis-bg); color: var(--cat-analysis); }
  .badge-cat.cat-arch { background: var(--cat-arch-bg); color: var(--cat-arch); }
  .badge-cat.cat-financial { background: var(--cat-financial-bg); color: var(--cat-financial); }
  .badge-cat.cat-team { background: var(--cat-team-bg); color: var(--cat-team); }
  .badge-cat.cat-ada { background: var(--cat-ada-bg); color: var(--cat-ada); }
  .badge-cat.cat-material { background: var(--cat-material-bg); color: var(--cat-material); }

  .badge-source {
    background: var(--bg);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .badge-year {
    background: var(--accent);
    color: #fff;
  }

  .badge-repeat {
    background: var(--repeat-bg);
    color: var(--repeat-color);
  }

  .badge-hot {
    background: var(--hot-bg);
    color: var(--hot-color);
  }

  .badge-practice {
    background: #e8f4e8;
    color: #1a5c1a;
    border: 1px dashed #1a5c1a;
  }

  .badge-trick {
    background: #fff0d0;
    color: #7a4500;
    border: 1px solid #c87000;
  }

  .pattern-note {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-style: italic;
    padding-left: 52px;
    font-family: 'Courier New', monospace;
  }

  .category-legend {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    padding: 1rem 2.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.72rem;
    font-family: 'Courier New', monospace;
    color: var(--text-muted);
    cursor: pointer;
    padding: 3px 6px;
    border-radius: 3px;
    border: 1px solid transparent;
    transition: border-color 0.15s;
  }

  .legend-item:hover { border-color: var(--border-strong); }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .hidden { display: none !important; }

  footer {
    padding: 2rem 2.5rem;
    border-top: 2px solid var(--border-strong);
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;
    color: var(--text-light);
    background: var(--surface);
  }

  @media print {
    .controls, .stats-bar, .category-legend { display: none; }
    .q-card { break-inside: avoid; }
  }
</style>
</head>
<body>

<header>
  <h1>EERI Seismic Design Competition — Judge Question Bank</h1>
  <p>Compiled from SDC presentation recordings &nbsp;|&nbsp; Updated progressively by year</p>
</header>

<div class="stats-bar">
  <div class="stat"><span class="stat-num" id="stat-total">0</span><span class="stat-label">Total Questions</span></div>
  <div class="stat"><span class="stat-num" id="stat-visible">0</span><span class="stat-label">Showing</span></div>
  <div class="stat"><span class="stat-num" id="stat-repeat">0</span><span class="stat-label">Repeated Themes</span></div>
  <div class="stat"><span class="stat-num" id="stat-hot">0</span><span class="stat-label">Hot Patterns (3+)</span></div>
  <div class="stat"><span class="stat-num" id="stat-teams">0</span><span class="stat-label">Teams Sourced</span></div>
</div>

<div class="category-legend" id="legend"></div>

<div class="controls">
  <input type="text" id="search" placeholder="Search questions, teams, patterns..." oninput="applyFilters()">
  <select id="filter-cat" onchange="applyFilters()">
    <option value="">All categories</option>
    <option value="cat-structural">Structural System</option>
    <option value="cat-damping">Damping System</option>
    <option value="cat-geotech">Geotechnical & Site Class</option>
    <option value="cat-ground">Ground Motion Selection</option>
    <option value="cat-analysis">Analysis & Performance</option>
    <option value="cat-arch">Architectural & Sustainability</option>
    <option value="cat-financial">Financial Analysis</option>
    <option value="cat-team">Team Organization & Process</option>
    <option value="cat-ada">ADA & Accessibility</option>
    <option value="cat-material">Material Properties & Testing</option>
  </select>
  <select id="filter-year" onchange="applyFilters()">
    <option value="">All years</option>
    <option value="2024">2024</option>
    <option value="2025">2025</option>
    <option value="PRACTICE">Practice / Generated</option>
  </select>
  <label><input type="checkbox" id="filter-repeat" onchange="applyFilters()"> Repeated only</label>
  <label><input type="checkbox" id="filter-hot" onchange="applyFilters()"> Hot patterns only</label>
  <label><input type="checkbox" id="filter-practice" onchange="applyFilters()"> Practice only</label>
  <label><input type="checkbox" id="filter-trick" onchange="applyFilters()"> Trick Qs only</label>
</div>

<div class="results-info" id="results-info"></div>

<div class="question-list" id="question-list"></div>

<footer id="footer-info">
  SDC Question Bank &nbsp;|&nbsp; 2024 data loaded &nbsp;|&nbsp; Add more years by uploading transcripts
</footer>

    note:"Slenderness ratio KL/r must be checked; for balsa braces, the low E makes this a critical check." },
  { id:"P-S10",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:false,repeatGroup:null,repeatCount:0,
    question:"Your building has a large cantilever overhang — how did you prevent uplift forces from pulling the anchor columns out of the base plate during overturning?",
    note:"Uplift at anchor points is a top failure mode in physical models; answer should describe tie-down detailing." },
  { id:"P-S11",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You used X-bracing throughout — if one diagonal buckles under compression, does the other diagonal still carry the full lateral load? What happens to the panel stiffness?",
    note:"TRICK: after compression diagonal buckles, tension diagonal alone carries load, but the panel loses significant lateral stiffness." },
  { id:"P-S12",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you account for the P-delta effect — secondary moments caused by gravity loads acting on the laterally displaced structure?",
    note:"P-delta is significant in taller structures; SAP2000/ETABS has a P-delta analysis option that should be activated for tall buildings." },
  { id:"P-S13",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is your building's height-to-width aspect ratio, and did that ratio influence any of your structural system decisions?",
    note:"H/W > 5 makes overturning a dominant concern; this ratio should have been a key early design parameter." },
  { id:"P-S14",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did your diaphragm design ensure in-plane rigidity at each floor level — and were any floors treated as flexible or semi-rigid diaphragms?",
    note:"Diaphragm rigidity affects lateral load distribution to vertical elements; balsa diaphragms without sheathing may be semi-rigid." },
  { id:"P-S15",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:false,repeatGroup:null,repeatCount:0,
    question:"Did you design for simultaneous bidirectional seismic loading, or only independently in each axis? How do corner columns behave under combined loading?",
    note:"Bidirectional loading creates combined axial+bending demands in corner columns; ASCE 7 requires 100%+30% orthogonal combination." },
  { id:"P-S16",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You described your system as a 'dual system' — but ASCE 7-22 requires the moment frame in a dual system to independently resist at least 25% of the lateral force. Did your moment frame satisfy that requirement on its own?",
    note:"TRICK: many teams use the term 'dual system' without verifying the 25% moment frame contribution rule." },
  { id:"P-S17",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you distribute lateral forces to each brace plane — using a tributary width approach or rigidity-based distribution?",
    note:"Rigidity-based distribution is more accurate for non-symmetric buildings; tributary method is simpler but less precise." },
  { id:"P-S18",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:false,repeatGroup:null,repeatCount:0,
    question:"What was the governing performance criterion for your design — drift, acceleration, strength, or stability — and how did you confirm your design met it?",
    note:"Competition scoring penalizes both excessive drift and excessive acceleration; know which criterion governed your design." },
  { id:"P-S19",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:false,repeatGroup:null,repeatCount:0,
    question:"Did you check inter-story drift ratios for all floors, or only the critical ones? What was your maximum computed inter-story drift ratio?",
    note:"ASCE 7-22 limits inter-story drift to 2% for Risk Category II; have this number ready." },
  { id:"P-S20",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:false,repeatGroup:null,repeatCount:0,
    question:"If your structure were redesigned for a higher seismic zone — Site Class E instead of D — what would be the first element you would strengthen and why?",
    note:"Answer should reference the highest-stressed member from the SAP analysis as the first candidate for strengthening." },
  { id:"P-S21",year:"PRACTICE",team:"Practice",category:"cat-structural",categoryLabel:"Structural System",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You placed bracing symmetrically to reduce torsion — but your stair and elevator core is offset to one side. Doesn't that mass asymmetry still create torsional demands regardless of your symmetric bracing?",
    note:"TRICK: symmetric stiffness alone does not eliminate torsion if the center of mass is eccentric. Answer must address the residual eccentricity." },

  // ── DAMPING SYSTEM (21) ────────────────────────────────────
  { id:"P-D01",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the target supplemental damping ratio your device adds to the structure, and how did you calculate or verify that value?",
    note:"Know the added damping percentage from device specs or logarithmic decrement testing." },
  { id:"P-D02",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"At which story or stories did you place your dampers, and what analysis — specifically which output — guided that placement decision?",
    note:"Optimal placement is at the story with maximum inter-story drift; show the drift profile from SAP/ETABS." },
  { id:"P-D03",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your viscous dampers are most effective at high relative velocity. At which floor is the relative inter-story velocity greatest during the design earthquake — and did you actually place a damper there?",
    note:"TRICK: maximum relative velocity is not always at the roof; it depends on the mode shape. Check velocity demand profile, not just displacement." },
  { id:"P-D04",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you determine the damping coefficient C for your device — from theory, physical testing, or published data? How did you scale it for your model?",
    note:"If from published data (Taylor Devices etc.), the scaling from full-scale to model scale must be explicitly justified." },
  { id:"P-D05",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the force-velocity relationship of your damper — is it linear (α=1) or non-linear (α<1)? How does the velocity exponent α affect its performance under low-velocity motions?",
    note:"α<1 makes dampers more effective at low velocities; this is a key parameter in the ETABS damper link element definition." },
  { id:"P-D06",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"Did you perform a sensitivity study — what happens to your peak roof displacement if the effective damping ratio is halved due to manufacturing tolerance?",
    note:"Robustness check: even with degraded damping, the structure should still meet the performance target." },
  { id:"P-D07",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Viscous dampers primarily reduce peak velocity and cumulative energy, but are less effective against the single large pulse of a near-fault ground motion. How confident are you that your dampers are effective for the near-fault records in your suite?",
    note:"TRICK: pulse-type motions drive peak displacement through a velocity pulse, which dampers do not efficiently reduce. A prepared team acknowledges this limitation." },
  { id:"P-D08",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you connect the damper to the structural frame — describe the full load path from the damper end plate to the nearest column.",
    note:"Connection stiffness must be >> damper stiffness to ensure the device activates; gusset plates and adhesive bonds in balsa models." },
  { id:"P-D09",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"Did you compare the cost of adding dampers against the structural savings they enabled — and was the net effect positive in your financial model?",
    note:"Dampers have high upfront cost but allow lighter framing; net financial benefit should be quantified." },
  { id:"P-D10",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does your damper perform differently under Ground Motion 1 (near-fault) versus Ground Motion 2? Did you observe a meaningful difference in effectiveness?",
    note:"Near-fault records typically produce larger velocity pulses; damper efficiency should be compared across both records." },
  { id:"P-D11",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You installed dampers on only two floors. If a damper on one floor becomes non-functional after the first strong shaking event — say, due to fluid leakage — does the structure still meet its performance target with only one damper floor active?",
    note:"TRICK: tests redundancy thinking. Answer should show the structure was checked for a single-damper-failure scenario." },
  { id:"P-D12",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you validate the damping ratio your device provides — did you use a free-vibration decay test, and what logarithmic decrement did you measure?",
    note:"Logarithmic decrement: ξ = δ/(2π) for small damping. A physical snap test is the standard validation method." },
  { id:"P-D13",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does the orientation of your damper — horizontal vs. diagonal — affect its efficiency? A diagonal damper has a projection factor of cos²θ relative to story drift — what is your θ and the resulting efficiency?",
    note:"Horizontal dampers use direct relative floor displacement; diagonal dampers lose efficiency by a cosine-squared factor." },
  { id:"P-D14",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"What happens to the axial force in the columns adjacent to your dampers at peak seismic response — do the damper reaction forces create additional column demands?",
    note:"Damper forces transfer to adjacent columns; these additional forces must be checked in the SAP model with damper links active." },
  { id:"P-D15",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you ensure the damper connection is stiff enough that the device itself deforms rather than the connection detail?",
    note:"Connection stiffness must be >> damper stiffness to ensure device activation at the correct displacement threshold." },
  { id:"P-D16",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You said your tuned mass damper is tuned to the fundamental frequency of the structure. But the structure's frequency changes as it softens during yielding in a large earthquake — what happens to TMD effectiveness when the building's period shifts?",
    note:"TRICK: TMDs are frequency-sensitive; structural softening detunes the device and significantly reduces its effectiveness — a known passive TMD limitation." },
  { id:"P-D17",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you account for the additional mass of your damping device in the seismic weight and center of mass calculation?",
    note:"Damper mass (especially TMD or fluid dampers) adds to seismic weight and shifts the center of mass." },
  { id:"P-D18",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the real-life inspection and replacement schedule for your damper, and how accessible are those locations for maintenance crews?",
    note:"Inaccessible dampers have higher lifecycle costs; inspection access should be shown on the floor plan." },
  { id:"P-D19",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"Did you consider temperature sensitivity of your damping fluid or mechanism — how would Seattle's temperature range affect the device's performance?",
    note:"Viscous fluids change viscosity with temperature; oobleck (non-Newtonian) is especially temperature-sensitive near freezing." },
  { id:"P-D20",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does your device compare in damping efficiency and cost to a conventional buckling-restrained brace (BRB) of similar cost?",
    note:"BRBs provide both stiffness and damping through yielding; they are often a cost-effective alternative to supplemental dampers." },
  { id:"P-D21",year:"PRACTICE",team:"Practice",category:"cat-damping",categoryLabel:"Damping System",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your friction damper relies on a constant slip force — but bolt relaxation or creep over time can reduce the clamping force and therefore the slip threshold. How did you address long-term reliability of the friction interface?",
    note:"TRICK: bolt relaxation is a real issue in friction dampers. Advanced solution: pre-tensioned Belleville washers or a periodic re-torquing maintenance schedule." },

  // ── GEOTECHNICAL & SITE CLASS (21) ────────────────────────
  { id:"P-G01",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"Walk us through your Vs30 calculation — how did you compute the average shear-wave velocity for the top 30 meters from the boring log data?",
    note:"Vs30 = 30 / Σ(di/Vsi); use SPT-Vs correlations (e.g., Andrus & Stokoe) if direct Vs measurements are unavailable." },
  { id:"P-G02",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"How deep is your groundwater table, and what is its specific effect on liquefaction triggering potential for the sandy layers at your site?",
    note:"Shallow groundwater (< 3m) significantly raises liquefaction risk; water table depth is a direct input to the Seed-Idriss simplified procedure." },
  { id:"P-G03",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You concluded the site has low liquefaction risk — but one boring log shows SPT N-values below 15 in loose saturated sand. Could you reconsider that conclusion using the Seed-Idriss simplified procedure?",
    note:"TRICK: N < 15 in saturated loose sand is a liquefaction red flag. The simplified procedure compares CRR to CSR; low N means low CRR." },
  { id:"P-G04",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the bearing capacity of the founding stratum at your site, and how does it compare to the design column loads from your structural analysis?",
    note:"Foundation adequacy: check bearing capacity vs. column load. Pile foundations transfer to deeper competent layers if shallow bearing is insufficient." },
  { id:"P-G05",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you estimate the pile length needed to achieve adequate skin friction and end bearing in the dense sand layers below the weak surface soils?",
    note:"Pile length = load demand / (unit skin friction × pile perimeter + end bearing area × unit tip resistance); use SPT correlations." },
  { id:"P-G06",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"Seattle's glacial geology creates highly variable soil conditions over short distances — how did you account for the spatial uncertainty between boring logs B1 and B2?",
    note:"With only two borings, use the more conservative classification; spatial variability justifies adopting worse-case parameters for design." },
  { id:"P-G07",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You classified the site as Site Class C based on average Vs30 — but the top 5 meters show very soft fill material. Under ASCE 7-22, could soft surface layers cause a downgrade to Site Class D even if the average Vs30 is adequate?",
    note:"TRICK: yes — ASCE 7-22 has provisions requiring default Site Class D when soft surface layers are present regardless of average Vs30. This is frequently overlooked." },
  { id:"P-G08",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the risk of slope instability or lateral spreading near Puget Sound at your site, and how does your foundation system specifically mitigate that hazard?",
    note:"Lateral spreading toward Puget Sound requires deep foundations extending below the liquefiable layer, plus potential ground improvement." },
  { id:"P-G09",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"Did you check for differential settlement between the different pile groups under your three building zones, which carry very different loads?",
    note:"Differential settlement between zones with different seismic weights can impose additional bending on connecting structural elements." },
  { id:"P-G10",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"How would the presence of the Pioneer Square underground light rail tunnel near the site affect your foundation design — depth constraints, vibration, and pile placement?",
    note:"Underground infrastructure limits pile locations and depths; the tunnel creates an exclusion zone and may require micro-piles or helical piles." },
  { id:"P-G11",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You selected a raft foundation to prevent differential settlement — but raft foundations on liquefiable sites can sink or tilt during liquefaction. How does your raft design address loss of bearing capacity during a major seismic event?",
    note:"TRICK: raft foundations on liquefiable sites fail by bearing capacity loss. Correct approach: ground improvement beneath the raft, or deep piles through the liquefiable layer." },
  { id:"P-G12",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you account for seismic soil-structure interaction — does the flexibility of the soil affect the natural period and response of your building?",
    note:"SSI can lengthen the building period; most teams use a fixed-base model (conservative for stiff soils, non-conservative for soft soils)." },
  { id:"P-G13",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the recurrence interval of the design earthquake for your site, and what probability of exceedance does ASCE 7-22 use for the MCER level?",
    note:"MCER = 2% probability of exceedance in 50 years = 2,475-year return period. Design level = 2/3 × MCER." },
  { id:"P-G14",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"Both boring logs show dense material or concrete at approximately 30 feet depth — how did that discovery influence your foundation type selection and depth?",
    note:"Competent material at 30 feet makes driven piles to that depth cost-effective; founding on rock or dense gravel provides excellent bearing." },
  { id:"P-G15",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"What groundwater management strategy did you propose during construction — how would you prevent seepage into the foundation excavation?",
    note:"Seattle's high groundwater requires dewatering systems: well points, sump pumping, or sheet pile cofferdam during construction." },
  { id:"P-G16",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does the Seattle Fault's proximity affect your site amplification factors Fa and Fv compared to a site farther from the fault?",
    note:"Near-fault sites have higher directivity effects captured in Ss and S1; Fa and Fv then amplify these to site-specific spectral accelerations." },
  { id:"P-G17",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You said the site has low liquefaction risk because the soil is dense. But a M9.0 Cascadia Subduction Zone event generates very high CSR that could exceed the CRR of even dense sands. Did you specifically check the subduction scenario?",
    note:"TRICK: dense sand has higher CRR but a M9.0 event produces extreme CSR. Both local crustal and subduction scenarios must be checked." },
  { id:"P-G18",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"Did you use the USGS VS30 mapper or derive Vs30 analytically from boring logs? Why might the two approaches give different answers for your site?",
    note:"USGS mapper uses surficial geology correlations which can differ from direct SPT-based calculations from site-specific borings." },
  { id:"P-G19",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"How far is your site from the Seattle Fault rupture zone, and how does fault-to-site distance affect spectral acceleration values at long periods?",
    note:"Distance attenuates ground motion through geometric spreading; near-fault sites (< 15km) also experience forward directivity effects at long periods." },
  { id:"P-G20",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:false,repeatGroup:null,repeatCount:0,
    question:"What minimum pile embedment depth did you require below the competent bearing stratum, and what criteria determined that minimum?",
    note:"Pile tip should penetrate 1–2 diameters below the top of the competent stratum for adequate end bearing development." },
  { id:"P-G21",year:"PRACTICE",team:"Practice",category:"cat-geotech",categoryLabel:"Geotechnical & Site Class",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You used only two boring logs to characterize a 60×60 meter site. If soil conditions vary significantly between those two points, how confident can you really be in your site class determination?",
    note:"TRICK: two borings rarely suffice for full site characterization. Conservative approach: adopt the worse site class in the absence of additional data." },

  // ── GROUND MOTION SELECTION (21) ──────────────────────────
  { id:"P-GM01",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the difference between the MCER spectrum and the design spectrum in ASCE 7-22, and which one did you use as the target for ground motion selection?",
    note:"MCER = 2% in 50 years; design spectrum = 2/3 × MCER. Ground motion selection targets MCER; structural design uses design spectrum." },
  { id:"P-GM02",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"How many ground motions does ASCE 7-22 require for 3D time history analysis, and why did the competition specify 11 records specifically?",
    note:"ASCE 7-22: minimum 11 for 3D analysis when using the average of results; 7 if using the maximum. 11 provides better statistical stability." },
  { id:"P-GM03",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ If a record requires a scale factor greater than 4 to match your target spectrum, ASCE 7-22 recommends against using it. Did any of your records have scale factors exceeding that threshold?",
    note:"TRICK: large scale factors non-physically alter frequency content. Teams should know their scale factor range and flag any records requiring scale factors > 4." },
  { id:"P-GM04",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"What period range did you use for spectral matching, and how did you select the upper and lower bounds of that window?",
    note:"ASCE 7-22 recommends matching over 0.2T1 to 1.5T1; competition guide may specify a different range." },
  { id:"P-GM05",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"Did you distinguish between fault-normal and fault-parallel components for near-fault records? Why does the fault-normal direction matter for a site near the Seattle Fault?",
    note:"Near-fault directivity is strongest in the fault-normal direction; using fault-parallel component significantly underestimates peak demands." },
  { id:"P-GM06",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you use the USGS deaggregation tool to identify the dominant magnitude-distance scenario driving your site's seismic hazard?",
    note:"Deaggregation isolates contributions from each magnitude-distance bin, identifying the design earthquake's dominant M and R." },
  { id:"P-GM07",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You selected records primarily matching the crustal fault scenario. But the Cascadia Subduction Zone dominates the long-period hazard in Seattle — by omitting subduction records, aren't you underestimating demands on your tall, long-period building?",
    note:"TRICK: for tall Seattle buildings, subduction records govern at long periods. Single-scenario selection can miss higher-mode demand from subduction events." },
  { id:"P-GM08",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the difference between RotD50 spectral matching and RotD100 matching, and which does ASCE 7-22 (2022 edition) require for ground motion selection?",
    note:"RotD50 is median over all rotation angles; RotD100 is the maximum. ASCE 7-22 updated to require RotD100 for horizontal component selection." },
  { id:"P-GM09",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you verify that the mean spectrum of your 11 selected ground motions does not fall below the target spectrum at any period within the matching range?",
    note:"ASCE 7-22 requires the mean of selected records to meet or exceed the target at all periods in the matching window — show this plot." },
  { id:"P-GM10",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"Did you apply both horizontal components of each ground motion simultaneously to your 3D model? How does using both components versus only one affect torsional response?",
    note:"3D analysis requires both horizontal components simultaneously; using only one misses torsional coupling effects." },
  { id:"P-GM11",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You minimized mean squared error to select your 11 records — but MSE minimization can still produce records that individually overshoot or undershoot the target at specific periods. How did you verify no individual record was severely mismatched?",
    note:"TRICK: ASCE 7-22 requires each individual record to be at least 0.9 × target at any period in the matching range. Average MSE can mask individual outliers." },
  { id:"P-GM12",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"How long is the strong-motion duration of your selected records, and why does duration matter differently for a ductile yielding system versus an elastic structure?",
    note:"Longer duration increases cumulative ductility demand in yielding systems; peak response of elastic structures is less duration-sensitive." },
  { id:"P-GM13",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the PGA of each of your 11 ground motions after scaling, and how do they compare to the design PGA for your site?",
    note:"PGA after scaling should be in a reasonable range relative to site design PGA; very high scale factors are a red flag." },
  { id:"P-GM14",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"Did you include pulse-like velocity records in your suite for the near-fault portion? How does a velocity pulse affect tall building response compared to a non-pulse record of the same PGA?",
    note:"Velocity pulses excite the fundamental period strongly and can cause large single-cycle displacements far exceeding multi-cycle demand at the same PGA." },
  { id:"P-GM15",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your team used NGA-Sub records for subduction ground motions — but NGA-Sub is dominated by Japanese and Chilean events. How confident are you those records appropriately represent a Cascadia Subduction Zone event?",
    note:"TRICK: few Cascadia strong-motion records exist; epistemic uncertainty is high. Acknowledge this limitation and explain why Japanese/Chilean records were used as proxies." },
  { id:"P-GM16",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you treat the vertical component of ground motion — was it included in your analysis or neglected, and how do you justify that decision?",
    note:"Vertical component is usually neglected for mid-rise buildings; should be checked for cantilevers, long-span beams, and near-fault sites." },
  { id:"P-GM17",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the epsilon (ε) value for your target spectrum, and how does record-to-record variability in ε affect the reliability of your mean response prediction?",
    note:"ε captures how many sigma above the median GMPE the target spectrum is; records with similar ε are more physically consistent for the hazard level." },
  { id:"P-GM18",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"The competition provided one mandatory ground motion (GM1) — how did that specific record influence your selection of the other 10 records to achieve spectral compatibility?",
    note:"The mandatory record constrains the mean spectrum; the remaining 10 records must compensate to keep the mean above the target at all matching periods." },
  { id:"P-GM19",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the tectonic regime of each of your 11 selected records — subduction interface, crustal, or intraslab — and does the mix reflect the relative hazard contributions from each regime?",
    note:"Deaggregation provides % hazard from each source; the record tectonic regime mix should approximately match those proportions." },
  { id:"P-GM20",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You matched ground motions between 0.2T1 and 3.0T1. But your building's second and third natural periods are well below 0.2T1 — didn't you miss higher-mode demands by not matching at shorter periods?",
    note:"TRICK: matching at short periods is important for floor accelerations and upper-story shear demands driven by higher modes in tall buildings." },
  { id:"P-GM21",year:"PRACTICE",team:"Practice",category:"cat-ground",categoryLabel:"Ground Motion Selection",trick:false,repeatGroup:null,repeatCount:0,
    question:"Can you describe what the Conditional Mean Spectrum (CMS) is, and explain why it might be more appropriate for record selection than the Uniform Hazard Spectrum?",
    note:"CMS conditions on a target period and avoids conservatism of the UHS which assumes all periods peak simultaneously — physically impossible." },

  // ── ANALYSIS & PERFORMANCE (21) ───────────────────────────
  { id:"P-A01",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the difference between a response spectrum analysis and a linear time history analysis — under what conditions would you choose one over the other?",
    note:"RSA is faster and directly addresses code checks; LTHA gives full time-dependent response but requires a full ground motion suite." },
  { id:"P-A02",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"How many modes did you include in your response spectrum analysis, and how did you verify that you captured at least 90% of the modal mass in each direction?",
    note:"ASCE 7-22 requires 90% mass participation; check the cumulative mass participation table in SAP/ETABS output." },
  { id:"P-A03",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your SAP model shows that the first mode is translational X and the second is translational Y. Is the third mode purely torsional? If T_torsion > T_translation, what does ASCE 7-22 say about your structure's classification?",
    note:"TRICK: if T_torsion > T_translation, the structure is torsionally irregular (Type 1a/1b per Table 12.3-1) and may require special analysis procedures." },
  { id:"P-A04",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you validate your SAP2000 model before running the time history analysis — what simple hand calculations did you perform to sanity-check the model?",
    note:"Static gravity validation, approximate period check (T ≈ 0.1N), and displaced-shape review are the minimum pre-run validation steps." },
  { id:"P-A05",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"What integration time step did you use in your time history analysis, and how did you verify it was small enough to accurately capture high-frequency response?",
    note:"Time step ≤ T_min/10 where T_min is the shortest period of interest; typical values 0.001–0.005 seconds." },
  { id:"P-A06",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you extract absolute acceleration from your model output — is it directly output by SAP/ETABS, or must you add ground acceleration to the relative output?",
    note:"Absolute acceleration = relative acceleration + ground acceleration. SAP/ETABS time history can output absolute values directly." },
  { id:"P-A07",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You reported peak roof displacement under GM1. But during an actual earthquake your structure experiences many cycles of loading — is peak displacement the right metric, or should you also evaluate cumulative ductility demand?",
    note:"TRICK: peak displacement captures maximum demand but cumulative demand governs fatigue-like failure in cyclic loading of ductile or brittle systems." },
  { id:"P-A08",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does the absolute roof acceleration relate to occupant safety and comfort — what acceleration threshold would you use for life safety versus serviceability?",
    note:"Life-safety limit: typically 0.5–1.0g+ for rare events; comfort limit: 0.1–0.25g for frequent events in office occupancy." },
  { id:"P-A09",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"What percentage of critical damping did you assume in your analysis, and how does that compare to the measured value from your physical free-vibration snap test?",
    note:"5% is the standard assumption; measured values for balsa models can range 3–8%. Any significant mismatch between assumed and measured should be explained." },
  { id:"P-A10",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you model the out-of-plane stiffness of your shear walls in SAP — as shell elements, equivalent frame elements, or something else?",
    note:"Shear wall modeling approach affects torsional stiffness and lateral load distribution; shell elements are most accurate." },
  { id:"P-A11",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You applied 5% damping equally to all modes — but higher modes typically have lower damping ratios. By over-damping higher modes, are you artificially suppressing floor accelerations at upper stories?",
    note:"TRICK: higher-mode damping is typically 2–3% in real structures; over-damping them underestimates floor accelerations. Rayleigh or modal-specific damping is more accurate." },
  { id:"P-A12",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the ratio of your maximum computed inter-story drift to the ASCE 7-22 allowable limit for your building occupancy? How much margin remains?",
    note:"Risk Category II typical limit: 2%; having the ratio ready shows design rigor and quantifies the margin against the limit." },
  { id:"P-A13",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"Did you check torsional irregularity ratios per ASCE 7-22 Table 12.3-1 — is your maximum story drift more than 1.2× the average story drift at any level?",
    note:"Torsional irregularity Type 1a: max drift > 1.2× avg; Type 1b: > 1.4× avg. Each type requires progressively more stringent analysis." },
  { id:"P-A14",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the relationship between your computed time history base shear and the equivalent lateral force (ELF) base shear — did you need to scale your THA results?",
    note:"ASCE 7-22 requires THA base shear ≥ 85% of ELF base shear; if below, results must be scaled up proportionally." },
  { id:"P-A15",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"Did you perform a pushover analysis to identify the yield sequence and collapse mechanism — and how did those results compare to your time history predictions?",
    note:"Pushover reveals which members yield first; comparison with THA shows whether the intended failure hierarchy is achieved." },
  { id:"P-A16",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your analysis used linear time history, which means no member yielding is allowed. But the moderate-to-large shaking in the competition may push balsa members beyond linear range. Aren't your linear predictions unconservative for the higher intensity motions?",
    note:"TRICK: linear analysis cannot capture post-yield redistribution or progressive collapse. For large shaking, linear models overestimate stiffness and underestimate displacements at high demands." },
  { id:"P-A17",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did the mass distribution change between your three zones, and how did you account for that variation in your seismic weight calculation and model mass assignment?",
    note:"Different floor areas and zone functions create different tributary masses per floor; each floor mass should be computed from actual dead loads." },
  { id:"P-A18",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"What was your fundamental period in each direction (N-S and E-W), and what caused any difference between the two? Which direction is more flexible?",
    note:"Asymmetric stiffness creates different periods in each direction; larger period = more flexible = more displacement but less force." },
  { id:"P-A19",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you define floor masses in your SAP model — as lumped masses at nodes, or as distributed area loads converted to mass? What are the implications of each approach?",
    note:"Distributed mass is more accurate for torsional inertia; lumped mass at a master node is simpler but loses rotational mass contribution." },
  { id:"P-A20",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the first torsional period of your building, and what is the ratio of torsional to translational period? Does it fall within ASCE 7-22 acceptable bounds?",
    note:"T_torsion / T_translation < 1.0 is preferred; exceeding 1.0 indicates torsional flexibility requiring special design consideration." },
  { id:"P-A21",year:"PRACTICE",team:"Practice",category:"cat-analysis",categoryLabel:"Analysis & Performance",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ ASCE 7-22 requires you to use the mean of all 11 results — but if any record causes your model to diverge numerically, you cannot simply exclude it. Did any of your 11 ground motions produce diverging or numerically unstable results?",
    note:"TRICK: numerical divergence in THA signals incipient collapse under that record. Correct response: redesign or use a nonlinear model capable of handling collapse." },

  // ── ARCHITECTURAL & SUSTAINABILITY (21) ───────────────────
  { id:"P-AR01",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does your building's facade system affect the lateral stiffness of the structure — does the cladding contribute any structural stiffness, intentionally or otherwise?",
    note:"Non-structural facades can add unintended stiffness, shortening the real period vs. the bare-frame model period." },
  { id:"P-AR02",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"How much of the roof area is covered by solar panels, and how did you estimate the annual energy generation in Seattle's climate, accounting for cloud cover?",
    note:"Seattle: ~150 sunny days/year, ~4 kWh/m²/day insolation; energy = panel area × efficiency (~20%) × insolation × days." },
  { id:"P-AR03",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your green roof adds significant dead load to the top of the building — did you include that mass in your seismic weight calculation? More mass at the top lengthens the period AND increases overturning moment — did you check both effects?",
    note:"TRICK: green roofs add 80–150 psf. Both the period change and increased overturning must be quantified and checked against limits." },
  { id:"P-AR04",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you calculate the annual rainwater collectible from your roof or facade, and how does it compare to the building's annual non-potable water demand?",
    note:"Collection = catchment area × annual rainfall (38 in/yr in Seattle) × runoff coefficient (0.8–0.9 for roof, 0.3–0.6 for facade)." },
  { id:"P-AR05",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does your building's massing strategy — narrower base or wider top — affect the wind loading distribution and overturning moment at each floor level?",
    note:"Inverted taper increases wind exposure at top and raises the centroid of wind force, amplifying overturning moment at the base." },
  { id:"P-AR06",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"You used a parametric or organic facade form — how did you ensure the irregular cladding panels are constructible and maintainable in practice?",
    note:"Complex facade geometry increases fabrication cost; the answer should address panelization strategy and access systems for maintenance." },
  { id:"P-AR07",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your design uses large floor-to-ceiling glass panels. During a strong earthquake, even if the structure survives, falling glass can cause casualties. How did you address the seismic performance of your facade glazing?",
    note:"TRICK: non-structural facade glazing performance is critical for life safety; drift-compatible glazing or laminated safety glass systems are the industry solution." },
  { id:"P-AR08",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you ensure your floor plans comply with IBC minimum egress requirements — corridor widths, number of exits, and maximum travel distance to an exit?",
    note:"IBC 2021: min 44-inch corridors, ≥2 exits for most occupancies, travel distance limits 200–300ft depending on sprinkler protection." },
  { id:"P-AR09",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does the Seattle 2030 District's 50% energy reduction target compare to a standard code-compliant building, and which features in your design contribute the most to that reduction?",
    note:"50% vs. 2003 ASHRAE 90.1 baseline; rank features by energy impact: HVAC efficiency > building envelope > lighting > plug loads." },
  { id:"P-AR10",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you balance the desire for open floor plans with the need for internal bracing and shear walls — where specifically did you hide or coordinate the structural system with architecture?",
    note:"This is the central architecture-structure tension; answer should identify specific decisions where bracing was integrated into cores, service walls, or perimeter frames." },
  { id:"P-AR11",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"What occupancy types does your building accommodate, and how does mixed use affect your structural design in terms of varying live load demands floor by floor?",
    note:"Office: 50 psf, residential: 40 psf, retail: 75–100 psf; these variations affect floor design and cumulative seismic weight." },
  { id:"P-AR12",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You placed the elevator core off-center to maximize floor efficiency — but an eccentric core shifts the center of rigidity, potentially creating a torsional irregularity. Did you check whether this offset creates a code-triggering eccentricity?",
    note:"TRICK: off-center cores are a common torsional irregularity source; the eccentricity ratio must be checked against ASCE 7-22 Table 12.3-1 thresholds." },
  { id:"P-AR13",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is your building's Floor Area Ratio (FAR), and how does it compare to the allowable FAR in downtown Seattle's zoning code for your site?",
    note:"Downtown Seattle FAR allowances range 10–25 depending on zone; exceeding the limit requires bonus FAR (affordable housing, public open space)." },
  { id:"P-AR14",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does natural light penetration change from lower floors to upper floors — did you consider daylight modeling, and how did the structural system affect facade transparency?",
    note:"Dense urban lower floors receive little direct sunlight; setbacks, light wells, or high-reflectance surfaces can improve daylighting." },
  { id:"P-AR15",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"You used a double-skin facade — how does the air gap behave thermally and acoustically, and how does it contribute to energy performance in Seattle's climate?",
    note:"Double-skin facade creates an insulating buffer zone; ventilated cavity reduces heat loss in winter and prevents overheating in summer." },
  { id:"P-AR16",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"How many parking spaces does your building provide, and how did you justify that number given Seattle's transit-oriented development policies?",
    note:"Seattle actively discourages car-centric development; a transit-oriented design minimizes parking and maximizes bike storage and transit proximity." },
  { id:"P-AR17",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You mention targeting LEED Platinum certification — but LEED requires third-party verification of all claimed metrics. How many of your sustainability claims are based on projections versus verified, measurable data?",
    note:"TRICK: most student SDC buildings use only estimated metrics. An honest answer distinguishes projections from verifiable performance data." },
  { id:"P-AR18",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does the building's massing respond to Seattle's prevailing wind direction — does the facade geometry minimize vortex shedding or wind-induced resonant oscillation?",
    note:"Aerodynamic shaping (tapered tops, chamfered corners, setbacks) reduces wind-induced oscillation in slender towers." },
  { id:"P-AR19",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"How do your communal spaces — lobby, sky garden, observation deck — contribute to the building's revenue model, and what is the financial trade-off versus using that area as leasable space?",
    note:"Amenity spaces increase rental rates and attract tenants willing to pay a premium, but reduce directly-leasable floor area." },
  { id:"P-AR20",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:false,repeatGroup:null,repeatCount:0,
    question:"Did you consider post-earthquake functionality in your design — what performance level did you target, and how quickly could the building be reoccupied after the design earthquake?",
    note:"Immediate Occupancy vs. Life Safety have very different structural cost implications; the target performance level should be explicitly stated." },
  { id:"P-AR21",year:"PRACTICE",team:"Practice",category:"cat-arch",categoryLabel:"Architectural & Sustainability",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your dramatic architectural form with cantilevered floors and an irregular footprint is striking — but it dramatically increases structural complexity and cost. How do you quantitatively justify the structural premium for the architectural statement?",
    note:"TRICK: value-judgment question. Good answer ties architectural distinctiveness to measurable benefits: higher rental rates, LEED premium, landmark status, reduced vacancy." },

  // ── FINANCIAL ANALYSIS (20) ───────────────────────────────
  { id:"P-F01",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you estimate the construction cost per square foot for your building type and height in downtown Seattle — what reference source did you use?",
    note:"RS Means or Gordian cost data is standard; downtown Seattle high-rise: $400–800/sqft depending on height and finish level." },
  { id:"P-F02",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"What market rental rate per square foot did you use for each occupancy type, and how did you source those figures?",
    note:"Downtown Seattle Class A office: ~$35–55/sqft/year; luxury residential: ~$3–5/sqft/month; competition rules may specify values." },
  { id:"P-F03",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your income calculation assumes 100% occupancy — but commercial buildings typically run 85–95% occupancy. How does a 10% vacancy rate change your projected annual income?",
    note:"TRICK: 100% occupancy is unrealistic. A 10% vacancy factor reduces gross income proportionally; a prepared team already applies this factor." },
  { id:"P-F04",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the net rentable area of your building, and how does it differ from the gross floor area? What building efficiency ratio did you achieve?",
    note:"Efficiency = net rentable / gross floor area; typical commercial efficiency: 75–85%. Below 70% is poor; above 90% is exceptional." },
  { id:"P-F05",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"What annual operating expenses did you include — property management, maintenance, insurance, property taxes, utilities — and what percentage of gross income do they represent?",
    note:"Operating expenses typically 30–45% of gross income; ignoring them significantly overstates net operating income." },
  { id:"P-F06",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you account for land acquisition cost — what price per square foot did you use for a downtown Seattle site of your building's footprint?",
    note:"Downtown Seattle land: $500–1000+/sqft; this is often the largest single cost component for urban high-rise development." },
  { id:"P-F07",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your financial analysis shows strong annual income — but you haven't mentioned debt service costs. At 7% annual interest on a $100M construction loan, what is the annual interest payment, and how does that change your net return?",
    note:"TRICK: financing costs on large construction loans can eliminate apparent profitability. Annual interest = loan amount × rate; must be subtracted from net operating income." },
  { id:"P-F08",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the investment payback period for your building, and what discount rate did you use to calculate the Net Present Value?",
    note:"Typical real estate discount rates: 6–9%; payback period for urban high-rise: 15–25 years depending on land cost and stabilized income." },
  { id:"P-F09",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does the premium cost of your damping system or sustainable features appear in your construction budget, and what is the cost per unit of performance benefit?",
    note:"Cost-benefit: $/% reduction in peak displacement, or $/kWh of energy saved per year." },
  { id:"P-F10",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"Did you estimate post-earthquake repair costs as part of your lifecycle financial model — how does your performance level affect long-term lifecycle cost?",
    note:"Life Safety performance has lower initial cost but higher post-earthquake repair costs than Immediate Occupancy; lifecycle cost analysis should compare both." },
  { id:"P-F11",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your building has three zones with different occupancy types and different structural complexity — did you verify that the zones with the highest structural cost also generate the highest rental income to justify their added cost?",
    note:"TRICK: complex upper zones may have higher construction costs due to cantilevers or dampers, but lower income if they house lower-rent uses. Zone-by-zone cost-benefit should be verified." },
  { id:"P-F12",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"How would adding a public plaza or ground-floor retail that generates less rent per square foot than office space affect your overall financial analysis?",
    note:"Seattle ground-floor retail: $20–35/sqft vs office: $35–55/sqft; retail adds activation value but reduces average revenue per square foot." },
  { id:"P-F13",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"What construction duration did you assume, and how does that affect financing cost and the delay in generating rental income?",
    note:"High-rise construction: 2–4 years. During construction, interest accrues on the loan with zero rental income — this carry cost is substantial." },
  { id:"P-F14",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"Did you include a cost premium for local sourcing of materials — and is that premium financially justified by reduced transportation emissions or tenant sustainability premiums?",
    note:"Local material premiums: 5–15% higher cost; sustainability-focused tenants may pay 5–10% rental premium for certified green buildings." },
  { id:"P-F15",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is the cost difference per square foot between your structural system and a standard moment frame — and does your system result in a cheaper or more expensive building overall?",
    note:"Braced frames typically $5–15/sqft less than moment frames due to simpler connections; overall savings depend on system complexity." },
  { id:"P-F16",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ You based your income on current market rental rates — but commercial real estate is cyclical. If rents drop 20% during a downturn, does your project still provide a positive return on investment? What is the break-even rental rate?",
    note:"TRICK: rental rate sensitivity analysis is standard in real estate finance. Break-even rental rate = minimum rent at which NOI covers debt service." },
  { id:"P-F17",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"How does your building's net annual income per square foot compare to a benchmark Class A office building in downtown Seattle?",
    note:"Benchmarking against real market data shows whether projections are realistic. Seattle Class A: ~$35–55/sqft NOI." },
  { id:"P-F18",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"What is your total structural system cost as a percentage of total project hard construction cost — and is that ratio consistent with industry benchmarks?",
    note:"Structural cost: typically 15–25% of total hard costs for medium to high-rise buildings; deviating significantly should be explained." },
  { id:"P-F19",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:false,repeatGroup:null,repeatCount:0,
    question:"Did you model sensitivity of your financial projections — what happens to your annual income if construction costs overrun by 20%?",
    note:"10–20% contingency is standard in early-stage cost estimates; a 20% overrun significantly changes the return on investment." },
  { id:"P-F20",year:"PRACTICE",team:"Practice",category:"cat-financial",categoryLabel:"Financial Analysis",trick:true,repeatGroup:null,repeatCount:0,
    question:"⚡ Your analysis shows this is a highly profitable project — if it's this attractive, why has this site been vacant since the Safety Building was demolished in the early 2000s? What real-world constraints might explain the gap between paper returns and actual development?",
    note:"TRICK: real obstacles include underground infrastructure (light rail tunnel), environmental remediation, zoning constraints, and market timing. A thoughtful answer acknowledges these barriers." },

  // ── TEAM ORGANIZATION & PROCESS (20) ─────────────────────
  { id:"P-T01",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did you manage version control for your structural model — what prevented different team members from overwriting each other's SAP or ETABS files?",
    note:"Even informal version control (dated file naming, shared drive folders) is important; describe what your team actually used." },
  { id:"P-T02",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"What was your project management approach — did you use any scheduling tool, and how did you track milestones toward the competition deadline?",
    note:"Gantt charts, shared spreadsheet timelines, or even weekly milestone lists show organizational maturity." },
  { id:"P-T03",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"How did the structural analysis team communicate design changes to the physical construction team when an analysis-driven change conflicted with what was already built?",
    note:"Answer should describe a specific conflict and the resolution process — this tests integration between sub-teams." },
  { id:"P-T04",year:"PRACTICE",team:"Practice",category:"cat-team",categoryLabel:"Team Organization & Process",trick:false,repeatGroup:null,repeatCount:0,
    question:"How many total person-hours did your team invest in this project, and how were those hours distributed across structural analysis, physical construction, architecture, and presentation?",
    note:"SDC teams typically invest 500–2000 person-hours; the distribution reveals where effort was concentrated." },
